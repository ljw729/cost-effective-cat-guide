    supports: 猫被明火和许多精油的味道吸引；常见伤害包括拍火导致爪尾烧伤、舔舐洒在毛上的香薰精油导致舌头严重化学烧伤；吞下精油可导致口腔、舌、食道显著化学烧伤；建议香薰容器选用猫无法打开的盖子，用电池蜡烛代替明火。
