id: CG-0091
slug: check-for-ticks
type: recommendation
title: 外出的猫在温暖季节要检查蜱虫，防蜱产品只用兽医推荐的
summary: 蜱虫可以传播致命疾病。外出的猫回家后梳毛检查，发现叮着的蜱虫用镊子贴近皮肤取下。
category: prevention
tags: [fleas, parasites]
recommendation: 能外出的猫在温暖季节常梳毛检查蜱虫；发现时用镊子贴近皮肤夹住蜱虫头部附近，持续稳定地拔出；防蜱滴剂和项圈只在兽医同意后使用。出现发热、精神差、不吃、关节肿胀时就医。
why_it_matters: >-
  康奈尔大学猫健康中心的皮肤科教授指出：关节僵硬肿胀、精神差、食欲下降和发热可能是蜱传疾病的表现，需要尽快就医；部分蜱传疾病（如土拉菌病、猫胞簇虫病）预后很差。
  防蜱的外用药和项圈含有强效化学物质，猫可能非常敏感，不应在没有兽医同意的情况下使用。温暖月份应经常梳毛检查。
applies_to: [outdoor]
urgency: routine
region_notes: 来源针对美国的蜱传疾病。不同地区的蜱种和疾病不同，请咨询当地兽医。
