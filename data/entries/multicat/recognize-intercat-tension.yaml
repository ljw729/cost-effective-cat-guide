id: CG-0027
slug: recognize-intercat-tension
type: recommendation
title: 学会识别猫之间不明显的紧张关系
summary: 猫之间的紧张很少是打架，更常见的是盯视、堵路、躲藏和乱尿。早发现、增加并分散资源，比让它们“自己解决”有效。
category: multicat
tags: [multicat, litter-box]
recommendation: 多猫家庭留意不明显的紧张信号；一旦发现，增加并分散资源、给每只猫安全的地方，而不是等猫“自己磨合”或强迫它们相处。
why_it_matters: >-
  2024 年 AAFP 指南指出，猫之间的紧张关系很常见，但多表现为细微的行为变化，常被忽视。
  信号包括盯视、走开、躲藏和堵路（一项美国调查中盯视最常见），也可能表现为过度舔毛、抓挠家具或尿液标记、排泄习惯改变。
  长期紧张可能导致与压力相关的疾病，甚至让猫被送走或安乐死。指南建议不要让猫“自己解决”，也不要强迫它们相处，而应检查资源是否足够、分布是否合理。
  关系好的猫常常挤在一起睡、互相舔毛、互相蹭、碰鼻子。
how_to_do_it:
  - 观察：一只猫是否总在某个地方被另一只猫盯着或挡着？是否有猫总躲着、不敢去猫砂盆或饭碗？
  - 安全处：一般每只猫一个，再多一个。
  - 资源：猫砂盆、食物、水、抓挠处分散到不同房间或区域。
  - 打架时：用毯子或纸板隔开，不要徒手分开；分开后让它们各自平静下来，可能需要几小时到几天。
  - 情况持续或出现乱尿、过度舔毛时，咨询兽医或兽医行为专科。
do_not:
  - 不要徒手去分开正在打架的猫。
  - 不要惩罚任何一只猫。
warning_signs:
  - 一只猫突然在猫砂盆外排泄：先排除疾病（公猫尿不出来见 CG-0007）。
