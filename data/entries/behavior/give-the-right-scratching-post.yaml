id: CG-0063
slug: give-the-right-scratching-post
type: recommendation
title: 猫抓家具？给它一个对的猫抓板，而不是惩罚它
summary: 抓挠是正常的标记行为，很难禁止。观察猫喜欢竖着抓还是横着抓、喜欢什么材质，买对应的猫抓板，放在它常抓的地方。
category: behavior
tags: [scratching]
recommendation: 观察猫喜欢抓的材质和方向，选择相应的猫抓柱（竖着抓）或猫抓板（横着抓），足够稳、不会晃；先放在猫常抓的位置旁边，猫使用时给零食和表扬；定期剪指甲。
why_it_matters: >-
  康奈尔大学猫健康中心指出，抓挠主要是标记行为（爪子上的腺体留下气味），也能去除爪鞘，是像理毛一样的天性，很难停止，但可以引导到合适的物品上。
  猫抓柱要匹配猫喜欢的材质（剑麻、地毯等）和方向，而且要稳固；放在猫喜欢抓的地方旁边，再逐渐移到你希望的位置。
  惩罚没有用：猫无法把惩罚和抓挠联系起来，只会学会害怕你，甚至导致攻击。去爪手术实际上是截掉脚趾末节骨头，有麻醉、感染等风险，且争议很大。
how_to_do_it:
  - 每个常被抓的地方旁边放一个。
  - 猫用了就立刻奖励零食。
  - 定期剪指甲，减少破坏。
do_not:
  - 不要喷水、大声吓、打猫。
  - 不要把去爪手术当作解决办法。
applies_to: [all]
