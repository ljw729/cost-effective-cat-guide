id: CG-0078
slug: new-cat-vet-check-and-separation
type: recommendation
title: 新猫到家：尽快看兽医，体检前先和原住猫分开
summary: 新猫到家后尽快带去体检，问清疫苗、驱虫和饮食史。家里已有猫时，新猫先单独住，等兽医检查后再慢慢介绍。
category: new-cat
tags: [new-cat, multicat]
recommendation: 新猫到家后尽快预约兽医体检，查寄生虫、根据情况检测 FeLV/FIV、补全疫苗；向原主人或机构要疫苗、驱虫、饮食记录。家里有猫时先分开，体检后再逐步介绍。
why_it_matters: >-
  康奈尔大学猫健康中心指出：任何新猫都应在到家后尽快由兽医检查；家里已有猫、尤其新猫健康史不明时，在兽医检查前应把新猫和原住猫分开；领养时询问之前的疫苗、营养、寄生虫控制和美容情况。
  兽医会检查体内外寄生虫并提供治疗和预防方案。
how_to_do_it:
  - 给新猫准备一个独立房间，有猫砂盆、水、食物和躲藏处。
  - 先沿用原来的猫粮，再慢慢换。
  - 介绍新猫要循序渐进（见“多猫紧张关系”条目）。
applies_to: [all, multi-cat, kitten]
urgency: important
