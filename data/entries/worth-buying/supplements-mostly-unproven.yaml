id: CG-0096
slug: supplements-mostly-unproven
type: evidence_gap
title: 抗衰老、护肾、护关节等保健品有用吗？目前大多证据不足
summary: 兽医学院资料里，抗氧化剂“被认为”能延缓衰老，肾病辅助疗法“尚未充分验证”，Omega-3 治哮喘“有前景但需要更多研究”。
category: worth-buying
tags: [supplements]
recommendation: 不要用保健品代替已被证明有效的治疗（如肾病处方粮、兽医开的药）；想用保健品时先问兽医，告诉兽医猫正在吃的所有产品。
why_it_matters: >-
  这是一个“目前不知道”的条目。康奈尔大学猫健康中心的相关页面一致显示证据有限：
  认知功能障碍页面说富含维生素 E 和抗氧化剂的饮食“被认为”能延缓衰老；慢性肾病页面说抗氧化剂补充等多种辅助疗法“并非都经过充分验证”，需要对照研究；哮喘页面说 Omega-3 脂肪酸等实验性疗法“显示出一些前景”，但需要进一步研究。
  在证据出来之前，保健品花的钱可能没有回报；更重要的是不要因此耽误真正有效的治疗。
applies_to: [all, senior]
urgency: routine
related: [CG-0068]
