id: CG-0007
slug: cannot-urinate
type: emergency
title: 猫尿不出来：当天急诊
summary: 猫反复蹲猫砂盆却只有一点尿或完全没有尿，可能是尿道堵塞，这是急症，尤其是公猫。不要等到第二天。
category: emergency
tags: [urethral-obstruction, litter-box]
recommendation: 发现猫反复用力排尿但尿很少或没有尿时，立即联系兽医或去急诊。
why_it_matters: >-
  康奈尔大学猫健康中心指出，尿道堵塞的猫只能排出很少的尿或完全排不出，常会反复用力、明显痛苦，尿道堵塞是“绝对的急症”。
  公猫的尿道更长更窄，更容易堵塞。一项 82 例尿道堵塞病例研究中，总死亡率为 8.5%，6 个月内复发率为 22%。
emergency_action:
  - 立即打电话给兽医或急诊，说明“猫一直蹲猫砂盆尿不出来”。
  - 如果能做到，拍一段猫在猫砂盆用力的视频，方便兽医判断。
  - 尽快出发；夜里就去急诊，不要等到第二天。
do_not:
  - 不要以为是便秘或“只是尿频”而在家观察。
  - 不要按压猫的腹部试图“挤尿”。
  - 不要自行喂药或偏方。
warning_signs:
  - 频繁进出猫砂盆、蹲很久，但只有几滴尿或没有尿
  - 排尿时叫唤、舔生殖器
  - 尿中带血
  - 呕吐、精神差、躲起来
applies_to: [all, male, adult]
urgency: emergency
related: [CG-0013]
scores:
  benefit: 5
  risk_reduction: 5
  money_cost: 4
