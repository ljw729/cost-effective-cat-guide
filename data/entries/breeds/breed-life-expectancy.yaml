id: CG-0117
slug: breed-life-expectancy
type: recommendation
title: 各品种的平均寿命不一样：英国数据中缅甸猫和伯曼猫最长，斯芬克斯最短
summary: 英国 2019 年数据：缅甸猫 14.4 年、伯曼猫 14.4 年、混种猫 11.9 年、暹罗 11.7 年、波斯 10.9 年、布偶 10.3 年、缅因 9.7 年、英短 9.6 年、孟加拉 8.5 年、斯芬克斯 6.7 年。
category: breeds
tags: [breeds, life-expectancy]
recommendation: 选品种前了解该品种的平均寿命和常见遗传病，把它当作参考而不是对单只猫的预测；买纯种猫时询问父母猫的健康检测（见“向繁育者要什么”条目）。
why_it_matters: >-
  英国 VetCompass 寿命表研究（已读全文）计算了 2019 年死亡数至少 15 例的品种出生时预期寿命：缅甸猫 14.42 年、伯曼猫 14.39 年、混种猫 11.89 年、暹罗猫 11.69 年、波斯猫 10.93 年、布偶猫 10.31 年、挪威森林猫 9.95 年、缅因猫 9.71 年、俄罗斯蓝猫类 9.65 年、英国短毛猫类 9.58 年、孟加拉猫 8.51 年、斯芬克斯猫 6.68 年。
  要注意：部分品种死亡样本很少（斯芬克斯 18 例、挪威森林猫 15 例），置信区间很宽；数据来自英国全科诊所，不代表其他国家；预期寿命受购买时代、饲养方式等多种因素影响，不只是基因。
applies_to: [all]
urgency: routine
