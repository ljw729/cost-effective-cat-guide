evidence:
  level: B
  summary: 多项独立研究（全科记录、问卷、口腔检查、CT、基因检测）方向一致；呼吸问题的数据来自主人报告，眼周清洁和天热降温是常见护理建议，没有专门研究。
  gaps:
    - "UNKNOWN: 扁脸猫是否更易中暑，本项目没有读到猫的直接研究（狗有较多研究）。"
