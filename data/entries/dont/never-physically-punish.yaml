id: CG-0064
slug: never-physically-punish
type: dont
title: 不要打猫、吓猫、喷水惩罚
summary: 体罚和吓唬会增加猫的恐惧和焦虑，让攻击和行为问题更严重，还会让猫害怕你。
category: dont
tags: [behavior-change, play]
recommendation: 遇到不想要的行为时，先排除疾病，再找出原因、改变环境、引导到合适的替代行为；不打、不喷水、不大声吓唬。
why_it_matters: >-
  康奈尔大学猫健康中心的行为页面多次强调：任何形式的体罚都会增加猫的恐惧或焦虑并加重攻击；猫无法把惩罚和行为联系起来，只会学会害怕主人。
  处理攻击行为的第一步是让兽医排除甲亢、关节炎、牙病等可能导致攻击的疾病。对于幼猫的玩耍攻击，用逗猫棒等远离手的玩具转移注意，而不是用手逗猫。
how_to_do_it:
  - 不用手或脚逗猫，用逗猫棒保持距离。
  - 猫准备扑咬时，用玩具转移它的注意力；必要时安静走开。
  - 摸猫时留意瞳孔放大、尾巴甩动、耳朵后压，在它攻击前停下。
applies_to: [all, kitten]
urgency: important
related: [CG-0039, CG-0063, CG-0088]
scores:
