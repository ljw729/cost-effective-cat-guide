id: CG-0060
slug: hairballs-are-not-always-normal
type: myth
title: 误区：猫吐毛球很正常，吐多少都不用管
summary: 部分正确。每一两周吐一次毛球常见，但反复干呕、吐不出来、不吃东西或精神差时要就医，毛球可能堵塞肠道，干呕也可能是哮喘。
category: myths
tags: [vomiting, hairball]
myth_claim: 猫吐毛球是正常现象，吐得多也不需要看兽医。
myth_verdict: partly_correct
recommendation: 每天梳毛减少吞下的毛；吐毛球之外出现反复干呕、频繁呕吐、一两天不吃或精神差时，尽快看兽医。不要自行给猫吃泻药或“化毛”产品代替就医。
why_it_matters: >-
  康奈尔大学猫健康中心的内科专家指出，猫每一两周吐一次毛球并不少见；但毛球如果太大，或进入小肠卡住，虽然少见却很严重，不手术可能致命。
  精神差、一两天以上不吃、反复干呕或呕吐的猫应尽快检查；频繁“咳毛球”可能根本不是毛球，而是哮喘等需要紧急治疗的呼吸道问题。
  长毛猫和换毛季更容易形成毛球，每天梳毛是减少毛球的办法；过度理毛还可能提示食物过敏等皮肤问题。
how_to_do_it:
  - 每天梳毛，换毛季尤其要坚持。
  - 记录吐毛球的频率（见“猫呕吐何时就医”条目）。
applies_to: [all]
urgency: important
related: [CG-0036, CG-0075]
scores:
