id: CG-0097
slug: early-detection-costs-less
type: recommendation
title: 省钱的关键是早发现：病拖到严重再治，往往更贵也更难
summary: 兽医学院资料指出，越早发现和治疗，预后越好、费用越低。每年体检、每月称重和观察变化，是最便宜的“保险”。
category: saving
tags: [checkup, hidden-illness]
recommendation: 把省钱的重点放在“早发现”：按年龄定期体检，每月称重和摸肿块，发现喝水、尿量、食欲、行为变化时及时就医，而不是等到猫明显生病。
why_it_matters: >-
  康奈尔大学猫健康中心的癌症警示页面指出，任何疾病越早发现和治疗，预后越好、治疗费用越低；慢性肾病页面指出，早期诊断和治疗与更好的生活质量和存活时间有关；老年猫页面强调猫擅长掩饰疾病，往往到很严重才表现出来。
  所以对普通家庭来说，定期体检和在家观察的成本最低、回报最高。
how_to_do_it:
  - 看“室内猫也要每年体检”“每月称体重”“每月摸肿块”这几个条目，把它们放进同一个每月提醒。
applies_to: [all]
urgency: routine
