id: CG-0130
slug: american-shorthair-and-other-hcm-breeds
type: recommendation
title: 美国短毛、挪威森林、西伯利亚、波斯等：也在心肌肥厚较常见的品种名单中
summary: 康奈尔列出的心肌肥厚较常见品种包括缅因、布偶、英短、美短、斯芬克斯、孟加拉、沙特尔、挪威森林、西伯利亚和波斯。但心肌肥厚在普通猫中也很常见。
category: breeds
tags: [heart-disease, american-shorthair, breeds]
recommendation: 养这些品种的猫，成年后和兽医讨论是否需要心脏超声；无论什么品种，听诊发现心杂音、呼吸变快时都要进一步检查。
why_it_matters: >-
  康奈尔大学猫健康中心指出，肥厚型心肌病是猫最常见的心脏病，在缅因、布偶、英国短毛、美国短毛、斯芬克斯、孟加拉、沙特尔、挪威森林、西伯利亚和波斯等品种中更常见，部分品种已发现相关基因突变；很多患猫看起来并不生病。
  一项英国研究对 780 只看起来健康的成年猫（多为非纯种）做心脏超声，14.7% 有肥厚型心肌病，患病率随年龄增加；心杂音很常见，但多数是功能性的，不能单靠杂音判断。
