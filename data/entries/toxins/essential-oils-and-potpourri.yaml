id: CG-0045
slug: essential-oils-and-potpourri
type: dont
title: 精油和加热香薰不要放在猫能碰到的地方
summary: 猫会被精油的味道吸引，舔到洒在毛上的精油可能造成口腔、舌头和食道严重化学烧伤。
category: toxins
tags: [essential-oils]
recommendation: 精油瓶、香薰炉、加热的香氛液放在猫碰不到的地方，选择有盖、猫打不开的容器。精油洒到猫身上时联系兽医。
why_it_matters: >-
  康奈尔大学兽医学院急诊重症科主任指出，他们常见的节日伤害之一，是猫打翻香薰容器后舔舐沾在毛上的精油，导致舌头严重化学烧伤；吞下精油可以造成口腔、舌头和食道的显著化学烧伤。
  同一页面还提醒，猫拍打明火会烧伤爪子和尾巴，建议用电池蜡烛代替。
how_to_do_it:
  - 香薰炉、精油扩香器放在猫跳不上去的地方，或干脆不用。
  - 用电子蜡烛代替明火蜡烛。
warning_signs:
  - 流口水、用爪扒嘴、不吃东西、舌头发红或溃疡：可能是化学烧伤，尽快就医。
applies_to: [all]
urgency: important
related: [CG-0046]
scores:
