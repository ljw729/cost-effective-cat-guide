id: CG-0013
slug: water-fountain
type: buying_guide
title: 自动饮水机值得买吗？
summary: 不是必需品。唯一一项相关的小型研究中，饮水机没有明显增加饮水量或让尿变稀。多放几个水碗、喂些湿粮更便宜。
category: worth-buying
tags: [water-fountain, hydration]
recommendation: >-
  饮水机不是必需品。想让猫多喝水，先从便宜的做法开始：在不同地方多放几个水碗、每天换水、混合喂湿粮。
  如果你的猫明显喜欢流动水，饮水机可以作为补充，但要能坚持清洁和更换滤芯。
why_it_matters: >-
  一项研究在 13 只健康猫家里比较了水碗和饮水机：1 只猫对饮水机反应不良（拒绝喝水、呕吐），其余 12 只用饮水机时喝水略多，但尿浓度没有显著差别。
  作者的结论是：在这项研究中，饮水机没能明显增加饮水量、让尿液变稀。样本小、时间短，所以不能排除对某些猫有帮助。
  湿粮含水至少 75%，干粮只有 6% 到 10%，所以喂湿粮是增加水分摄入更直接的途径。
how_to_do_it:
  - 在家里不同位置放 2 个以上水碗，远离猫砂盆。
  - 每天换水、定期洗碗。
  - 考虑部分喂湿粮。
  - 如果买饮水机：选好拆、好洗的；按说明清洁和换滤芯；放之前保留原来的水碗，观察猫是否接受。
exceptions:
  - 有泌尿问题或肾病的猫，增加饮水的方法请听兽医的建议。
warning_signs:
  - 猫突然喝水明显变多或变少，都值得看兽医。
applies_to: [all]
urgency: routine
related: [CG-0007]
scores:
  benefit: 2
  risk_reduction: 2
