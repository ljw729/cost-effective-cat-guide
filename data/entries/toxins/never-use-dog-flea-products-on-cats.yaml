id: CG-0005
slug: never-use-dog-flea-products-on-cats
type: dont
title: 不要给猫用狗用驱虫滴剂
summary: 很多狗用驱虫滴剂含扑灭司林（permethrin），对猫可能致命。只用明确标注“猫用”的产品。
category: toxins
tags: [permethrin]
recommendation: 只给猫使用明确标注适用于猫的驱虫产品。绝不使用狗用产品，也不要把大规格产品分装给猫用。
why_it_matters: >-
  澳大利亚一家转诊医院回顾的 42 例猫扑灭司林中毒中，41 例是主人直接给猫用了狗用扑灭司林滴剂，其中 3 例是主人把一支药分给几只狗和猫用。
  该研究汇总的其他报告中，也有猫因接触用过药的狗而中毒的病例。
  常见症状有震颤和肌肉抽动（86%）、抽搐（33%）、发热等；约三分之一的猫出现并发症，需要密集治疗。
  尽管包装上有醒目警告，这类病例仍在持续发生。
how_to_do_it:
  - 买驱虫药前看清适用动物和体重范围；不确定就问兽医。
  - 家里的狗用了驱虫药后，至少 24 小时内不要让猫接触这只狗；说明书要求更久的，按说明书。
  - 把猫用、狗用药品分开存放。
do_not:
  - 不要因为狗用的便宜、规格大，就拿来给猫用。
warning_signs:
  - 用药后出现发抖、肌肉抽动、走路不稳、流口水、抽搐：立即就医，并带上产品包装。
applies_to: [all, multi-cat]
urgency: important
scores:
  benefit: 5
  risk_reduction: 5
  money_cost: 0
  time_cost: 1
  effort: 1
  harm_potential: 0
  rationale: 避免可能致命的中毒，几乎没有额外成本。
evidence:
  level: B
  summary: >-
    回顾性病例系列清楚描述了暴露来源（狗用滴剂直接用在猫身上）、症状和并发症。
    尚未纳入指南级来源，因此评为 B。
  gaps:
    - "TODO: 纳入 iCatCare 的扑灭司林中毒资料（第一轮抓取没有拿到正文）。"
    - "已解决（2026-11-20）：康奈尔猫健康中心的家庭危险页面写明，猫在狗用药后 24 小时内不能接触这只狗。Boland 2010 全文没有给出时长。不同产品的要求可能不同，以说明书为准。"
