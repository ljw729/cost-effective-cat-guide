id: CG-0139
slug: heart-disease-is-common-in-healthy-looking-cats
type: recommendation
title: 看起来健康的猫，约 15% 有心肌肥厚：年纪大、公猫、偏胖的风险更高
summary: 英国一项研究给 780 只看似健康的成年猫做心脏超声，14.7% 有肥厚型心肌病。公猫、年龄增加、体况偏胖、较响的心杂音与诊断相关。
category: basics
tags: [heart-disease, sex-differences]
recommendation: 体检时让兽医听心脏；发现心杂音、尤其较响的杂音，或猫年纪大、偏胖时，和兽医讨论是否做心脏超声；在家记录睡眠呼吸频率；控制体重。
why_it_matters: >-
  一项英国研究在两个领养中心筛查了 780 只看似健康的 6 月龄以上猫：肥厚型心肌病患病率 14.7%，并随年龄增加；心杂音的患病率是 40.8%，其中约七成被认为是功能性的（不代表心脏病）；与诊断相关的因素是公猫、年龄增加、体况评分高和心杂音（尤其 3 级以上）。
  康奈尔大学猫健康中心指出，很多患心肌肥厚的猫看起来并不生病，但可能出现心衰、血栓（后腿突然瘫痪）甚至猝死；正确诊断和治疗能减少症状、降低血栓风险。
how_to_do_it:
  - 学会数睡眠呼吸频率（见 CG-0115）。
  - 保持理想体重（见体况条目）。
warning_signs:
  - 呼吸急促或张嘴呼吸：立即就医
  - 后腿突然瘫痪、剧痛：立即急诊
applies_to: [all, adult, senior, male]
urgency: important
related: [CG-0029, CG-0034, CG-0111, CG-0115, CG-0130]
