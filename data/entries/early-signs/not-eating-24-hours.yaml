id: CG-0035
slug: not-eating-24-hours
type: recommendation
title: 成年猫一天不吃、幼猫半天不吃就要看兽医
summary: 猫不吃东西不是“挑食”这么简单。成年猫持续不吃 24 小时就可能严重影响健康；6 周龄以下幼猫 12 小时不吃就可能致命。
category: early-signs
tags: [not-eating, hidden-illness]
recommendation: 成年猫持续不吃超过 24 小时、6 周龄以下幼猫超过 12 小时，尽快联系兽医。不要强行塞食物，除非兽医指导。
why_it_matters: >-
  康奈尔大学猫健康中心指出，厌食是糖尿病、肾病、脂肪肝、甲亢、胰腺炎、牙病、发烧等多种问题的表现，也可能来自压力（换粮、新宠物、失去同伴）。
  无论原因是什么，成年猫持续不吃 24 小时就可能严重影响健康，6 周龄以下幼猫 12 小时就可能致命；“猫从来不会只是决定不吃饭”。
  胖猫尤其要注意：不吃东西是脂肪肝的主要诱因。
how_to_do_it:
  - 每天留意猫吃了多少，多猫家庭尤其要确认每只猫都吃了。
  - 换粮要逐步进行（见“选择全价猫粮”条目）。
  - 不吃超过上述时间，或同时有呕吐、精神差，尽快就医。
do_not:
  - 不要强行往嘴里塞食物，兽医发现这会让猫更厌食。
  - 不要让胖猫“饿几天减肥”。
warning_signs:
  - 完全不吃，或只舔一点
  - 想吃但吃不下、吃的时候疼（可能是口腔问题）
  - 同时呕吐、躲起来、精神差
