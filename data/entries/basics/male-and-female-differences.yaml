id: CG-0111
slug: male-and-female-differences
type: recommendation
title: 公猫和母猫有什么不同：寿命、常见风险和绝育
summary: 英国大样本数据中，母猫平均预期寿命比公猫长约 1.3 年；未绝育的猫寿命更短。公猫更易尿道堵塞和心肌肥厚，未绝育母猫有乳腺肿瘤和子宫蓄脓风险。
category: basics
tags: [sex-differences, neuter]
recommendation: 了解性别相关的风险：公猫重点留意排尿（尿团变少、反复蹲盆是急症）和心脏；母猫在第一次发情前绝育可几乎消除乳腺肿瘤风险。不打算繁育的猫，公母都建议绝育。
why_it_matters: >-
  英国 VetCompass 2019 年 7,936 例死亡数据的寿命表显示：母猫出生时预期寿命 12.51 年，公猫 11.18 年，相差 1.33 年；在考虑其他因素后，公猫仍比母猫少活约 1.2 年；未绝育的猫 3 岁前死亡的几率是已绝育猫的 4.29 倍。另一项分析同一时期英国数据的研究发现，未绝育公猫寿命最短，已绝育母猫最长，并把公猫寿命较短归因于更多外伤和健康问题。
  公猫：尿道更长更窄，更容易尿道堵塞（急症）；一项 780 只看起来健康的猫的超声筛查中，公猫是诊断肥厚型心肌病的相关因素之一；未绝育、外出、爱打架的公猫感染猫艾滋的风险最高。
  母猫：在乳腺发育前（3 到 6 月龄）绝育几乎可以消除乳腺癌风险，并排除子宫蓄脓。
how_to_do_it:
  - 公猫：每天铲屎时留意尿团；反复蹲盆尿不出来当天急诊（见 CG-0007）。
  - 母猫：在第一次发情前和兽医商量绝育（见 CG-0056）。
applies_to: [all, male]
urgency: important
related: [CG-0007, CG-0056, CG-0087, CG-0139]
