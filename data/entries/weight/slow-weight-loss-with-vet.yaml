id: CG-0012
slug: slow-weight-loss-with-vet
type: dont
title: 胖猫不要自己突然节食
summary: 猫减肥要慢，每周大约减体重的 1% 到 2%，并在兽医指导下进行。不要自己突然大幅减少食物。
category: weight
tags: [weight]
recommendation: 超重的猫在兽医指导下制定减重计划，目标是缓慢减重（每周约 1% 到 2%）；不要自行突然断食或大幅减量。
why_it_matters: >-
  康奈尔大学猫健康中心建议逐步减重，大约每周减体重的 1% 到 2%，并且应在兽医指导下进行。
how_to_do_it:
  - 先带猫看兽医，确认理想体重和每天该吃多少。
  - 用秤称量食物，而不是用“一把”“一碗”估计。
  - 每 2 到 4 周称一次体重，按兽医建议调整。
  - 增加互动游戏，用益智喂食器让猫吃得慢一些（见 CG-0023）。
do_not:
  - 不要突然让猫一两天不吃东西。
warning_signs:
  - 猫完全不吃东西超过一天，尤其是胖猫：联系兽医。
applies_to: [adult, senior]
urgency: important
related: [CG-0011, CG-0023]
scores:
  benefit: 4
  risk_reduction: 3
  money_cost: 2
  time_cost: 2
  effort: 3
  harm_potential: 0
evidence:
