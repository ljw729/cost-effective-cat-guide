id: CG-0017
slug: vaccines-core-plus-lifestyle
type: recommendation
title: 疫苗：核心疫苗都打，其他按生活方式定
summary: 疫苗分“所有猫都建议打”的核心疫苗和“按风险决定”的非核心疫苗。不是越多越好，也不是室内猫就不用打。
category: prevention
tags: [vaccine]
recommendation: 和兽医一起，根据猫的年龄、生活方式（是否外出、是否多猫、是否寄养）、来源和当地疾病情况，制定疫苗方案：核心疫苗按计划接种，非核心疫苗按风险评估决定。
why_it_matters: >-
  2020 年 AAHA/AAFP 猫疫苗指南把疫苗分为核心疫苗（建议所有猫接种）和非核心疫苗（根据个体风险评估决定）。
  兽医应根据猫的生命阶段、生活方式、来源，以及环境和流行病学因素制定个体化方案。指南还指出，注射部位肉瘤仍然罕见。
  每次接种疫苗都应同时做全面体检。
how_to_do_it:
  - 第一次带猫看兽医时，说清楚猫是否外出、家里有几只猫、会不会寄养。
  - 保存好疫苗记录（照片或电子记录），寄养、搬家、出境时都会用到。
  - 生活方式改变时（比如开始外出、家里来了新猫），告诉兽医重新评估。
exceptions:
  - 狂犬病疫苗在很多地区受法律规定约束，以当地要求为准。
applies_to: [all, kitten, adult, indoor, outdoor]
urgency: important
region_notes: 哪些疫苗属于核心、多久加强一次、狂犬病疫苗的法律要求，因国家和地区而异。请以当地兽医和法规为准。
