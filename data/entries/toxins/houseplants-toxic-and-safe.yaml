id: CG-0051
slug: houseplants-toxic-and-safe
type: buying_guide
title: 买绿植前查一下：绿萝、龟背竹、芦荟对猫有毒，吊兰、散尾葵无毒
summary: 很多常见室内绿植被 ASPCA 列为对猫有毒。养猫家庭买植物前，先在 ASPCA 有毒 / 无毒植物数据库里查一查。
category: toxins
tags: [toxic-plants]
recommendation: 买绿植前按学名查 ASPCA 的猫有毒 / 无毒植物数据库；优先选列为无毒的植物；列为有毒的不要放在猫能接触到的地方。
why_it_matters: >-
  ASPCA 动物中毒控制中心的猫植物清单把许多常见室内植物列为对猫有毒，例如绿萝（黄金葛）、龟背竹、芦荟、虎尾兰、玉树（翡翠木）、长寿花（伽蓝菜）、花叶万年青、苏铁、白掌（和平百合）、马蹄莲、粤万年青、杜鹃、水仙、仙客来、夹竹桃、文竹（天门冬属）、铃兰、喜林芋。
  同一清单把吊兰、散尾葵、波士顿蕨、袖珍椰子（玲珑椰子）、蟹爪兰、非洲紫罗兰、竹芋列为对猫无毒。
  “有毒”的严重程度差别很大：有的只引起口腔刺激或呕吐，百合则可能致命。
how_to_do_it:
  - 用植物的学名搜索，俗名常常一名多物。
  - 不确定的植物先放在猫进不去的房间。
  - “无毒”也不代表可以大量啃食，啃了以后呕吐属于常见反应。
warning_signs:
  - 啃了有毒植物后流口水、呕吐、精神差：联系兽医，带上植物照片或叶子。
