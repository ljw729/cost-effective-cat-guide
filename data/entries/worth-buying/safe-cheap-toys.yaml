id: CG-0047
slug: safe-cheap-toys
type: recommendation
title: 玩具不用贵，但要避开小零件和线状部件
summary: 纸袋、纸箱、乒乓球就能让猫玩得很开心。真正要注意的是会脱落被吞下的小零件、羽毛和绳子。
category: worth-buying
tags: [play, foreign-body]
recommendation: 优先用便宜的纸袋、纸箱、乒乓球；避免带小零件、羽毛、绳子等容易脱落被吞下的玩具；带绳的逗猫棒只在人陪着时用。轮换玩具防止玩腻。
why_it_matters: >-
  康奈尔大学猫健康中心指出，玩具能让猫锻炼身体、动脑，避免肥胖和抓坏家具、乱尿等行为问题；好玩具不必贵，纸袋、纸箱和乒乓球就很受欢迎。
  选择时要避开带小零件或线状部件（羽毛、绳子）的玩具，它们可能在啃咬时脱落被吞下；玩耍区域不要有会砸到猫的重物或会让猫摔下的地方。
how_to_do_it:
  - 每次拿出几样玩具，过几天换一批。
  - 逗猫棒玩完收起来。
  - 玩具坏了、掉零件就扔掉。
applies_to: [all]
urgency: routine
