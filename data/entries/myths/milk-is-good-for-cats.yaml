id: CG-0026
slug: milk-is-good-for-cats
type: myth
title: 误区：猫喝牛奶很正常、很有营养
summary: 大多错误。动物体内的乳糖酶不多，牛奶和奶制品可能引起腹泻等消化问题。猫不需要喝奶，喝水就够了。
category: myths
tags: [milk]
myth_claim: 猫爱喝牛奶，牛奶对猫有营养。
myth_verdict: mostly_incorrect
recommendation: 不需要给猫喝牛奶。如果猫喝牛奶后拉稀，就别再给了。所谓“宠物牛奶”属于零食，算在零食热量里。
why_it_matters: >-
  ASPCA 动物中毒控制中心指出，宠物体内没有足够多的乳糖酶来分解乳糖，牛奶和奶制品可能引起腹泻或其他消化不适。
  康奈尔大学猫健康中心也指出，一般不建议把牛奶当零食给猫，因为很多猫乳糖不耐受，吃奶制品后可能出现胃肠问题。
  猫只要吃营养完整的主食，就不需要从牛奶中获得任何营养。
how_to_do_it:
  - 给猫准备干净的饮用水。
  - 想给奶类零食，少量试，观察有没有拉稀，并算进零食总量（见 CG-0010）。
applies_to: [all]
urgency: routine
related: [CG-0010]
scores:
  benefit: 2
  risk_reduction: 1
  money_cost: 0
  time_cost: 1
  effort: 1
  harm_potential: 0
evidence:
  level: B
  summary: >-
    两个机构的公开资料一致：ASPCA 说的是“宠物”整体，康奈尔明确说“很多猫”乳糖不耐受。
    “很多”不等于“全部”，不同猫的耐受度可能不同，因此判定为“大多错误”而非“完全错误”。
    评为 B（2026-11-20 经维护者确认由 C 上调，依据康奈尔针对猫的说法）。
