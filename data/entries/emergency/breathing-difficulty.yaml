  summary: >-
    大学兽医学院两篇资料（呼吸困难、肥厚型心肌病）一致：呼吸困难需要立即就医；心肌病导致心衰时会出现张嘴呼吸和呼吸急促。
    这是急症处理原则，不涉及具体治疗。
