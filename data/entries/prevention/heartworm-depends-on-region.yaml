    supports: 心丝虫只经蚊子叮咬传播；猫主要表现为肺部疾病（HARD）；常见症状包括间歇性呕吐、腹泻、呼吸急促、咳嗽、食欲差、体重下降，急性病例可猝死；猫心丝虫病无法治疗，狗用杀虫药对猫可能致命；在兽医同意下所有猫都应使用预防药，尤其是蚊子多的温暖潮湿地区。
