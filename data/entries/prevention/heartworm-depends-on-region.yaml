id: CG-0054
slug: heartworm-depends-on-region
type: recommendation
title: 心丝虫：在蚊子多、有心丝虫流行的地区，和兽医讨论预防
summary: 心丝虫经蚊子传播，在猫身上主要伤害肺部，而且没有安全的杀虫治疗方法，只能预防。是否需要取决于当地流行情况。
category: prevention
tags: [heartworm, parasites]
recommendation: 问当地兽医你所在地区猫是否有心丝虫风险；有风险的地区，按兽医建议给家里所有猫做预防（室内猫也会被蚊子叮）。
why_it_matters: >-
  康奈尔大学猫健康中心的寄生虫学教授指出，心丝虫只能通过蚊子叮咬进入猫体内，在猫身上主要造成肺部疾病；症状（间歇性呕吐、呼吸急促、咳嗽、体重下降）容易和哮喘混淆，急性病例可能突然死亡。
  与狗不同，猫的心丝虫病无法用杀虫药治疗，用于狗的强效药物对猫可能致命，因此预防是关键。
applies_to: [all, indoor, outdoor]
urgency: important
region_notes: 来源针对美国，尤其是温暖潮湿、蚊子多的地区。中国各地猫心丝虫的流行情况，本项目尚未找到可靠数据，请咨询当地兽医。
