id: CG-0008
slug: choose-complete-and-balanced-food
type: recommendation
title: 主食选标明“营养完整均衡”的猫粮
summary: 选主粮最重要的不是价格或品牌，而是看包装上有没有“营养完整均衡”的声明，以及它适用于哪个生命阶段。
category: nutrition
tags: [complete-balanced]
recommendation: 主食（干粮或湿粮都可以）选择包装上明确标注“营养完整均衡”（例如 AAFCO 营养充足声明）且适用于猫当前生命阶段的产品。
why_it_matters: >-
  康奈尔大学猫健康中心指出，带有 AAFCO 声明的猫粮被认为是营养完整均衡的；AAFCO 的猫营养专家小组设定了最低营养要求。
  标有“零食”“补充喂养”或没有这类声明的产品，不能长期当主食。
how_to_do_it:
  - 在包装上找营养充足声明，看清是“完整均衡”还是“补充喂养 / 零食”。
  - 看适用生命阶段：幼猫、成猫，或“所有生命阶段”。
  - 干粮和湿粮都可以是完整均衡的；选你的猫愿意吃、你能长期负担的。
  - 换粮时逐步过渡。
exceptions:
  - 有疾病的猫可能需要兽医开的处方粮，按兽医建议执行。
applies_to: [all]
urgency: important
region_notes: AAFCO 是美国标准；欧洲常见 FEDIAF 声明。中国国产猫粮的标签规范不同，看是否标注为“全价”猫粮。
