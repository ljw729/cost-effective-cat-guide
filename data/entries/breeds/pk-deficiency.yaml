id: CG-0126
slug: pk-deficiency
type: recommendation
title: 丙酮酸激酶缺乏：阿比西尼亚、索马里猫的遗传性贫血，也见于孟加拉和缅因猫
summary: 这是一种红细胞容易破裂的遗传性贫血，发病年龄和严重程度差别很大，有的猫多年没有症状。很多患猫在确诊前已经被用于繁育。
category: breeds
tags: [abyssinian, genetics, anemia]
recommendation: 购买阿比西尼亚、索马里、孟加拉、缅因猫时，询问父母猫的丙酮酸激酶缺乏基因检测；繁育前一定检测。猫出现精神差、牙龈苍白或发黄、体重下降时就医并告诉兽医品种。
why_it_matters: >-
  一项对 25 只患丙酮酸激酶缺乏的阿比西尼亚和索马里猫的随访研究显示：11 只猫主人没有发现症状；14 只出现精神差、腹泻、牙龈苍白、食欲差、毛差、体重下降、黄疸等；6 只在 1.3 到 11.3 岁时死亡或安乐死；16 只在确诊前至少繁育过一次。作者强调发病年龄和严重程度差异大。
  一项 11,036 只猫的基因检测研究发现，该病相关变异除阿比西尼亚和索马里猫外，还存在于另外 21 个品种；在孟加拉猫和缅因猫中发现了带两份变异的猫，部分出现症状。
warning_signs:
  - 精神差、不爱动
  - 牙龈苍白或发黄
  - 不明原因体重下降
applies_to: [all]
urgency: important
