evidence:
  level: B
  summary: >-
    两份 ISFM/AAFP 指南一致支持老年猫常规测血压；指南基于文献综述，同时说明很多方面仍需要更多数据。
    两份指南的年龄分段不同（高血压指南：7 到 10 岁、11 岁及以上；老年猫指南：10 岁以上），本条按高血压指南的频率表写。
