id: CG-0102
slug: senior-weekly-home-check
type: recommendation
title: 老年猫：每周在家做一次简单检查
summary: 把检查变成撸猫的一部分：看牙龈、摸身体、看眼睛、检查指甲。老年猫用猫抓板变少，指甲更容易长太长。
category: senior
tags: [senior, hidden-illness]
recommendation: 每周给老年猫做一次简单的居家检查：掀开嘴唇看牙和牙龈，摸全身有没有肿块和变瘦，看眼睛和耳朵，检查并修剪指甲，帮它梳理够不到的地方。具体方法请兽医示范。
why_it_matters: >-
  康奈尔大学猫健康中心建议老年猫主人每周在家做一次基础检查，并请兽医示范方法；把检查融入日常互动中更容易，例如挠下巴时顺便掀开上唇看牙。
  老年猫用猫抓柱的次数减少，指甲应每周检查、必要时修剪；老年猫自己理毛的能力下降，可能出现毛结、气味和皮肤炎症，每天梳毛有帮助。
