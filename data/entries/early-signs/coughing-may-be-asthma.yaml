id: CG-0089
slug: coughing-may-be-asthma
type: recommendation
title: 猫“咳毛球”却吐不出来？可能是哮喘
summary: 哮喘影响 1% 到 5% 的猫，表现为咳嗽、喘鸣、呼吸急促，常被误认为吐毛球。急性发作可以危及生命。
category: early-signs
tags: [breathing-difficulty]
recommendation: 猫反复出现蹲伏、伸脖子的干咳或“咳不出东西”的动作时，拍下视频给兽医看；出现张嘴呼吸或呼吸困难时立即急诊。
why_it_matters: >-
  康奈尔大学猫健康中心指出：哮喘是一种下呼吸道疾病，影响 1%–5% 的猫，表现包括呼吸困难、喘鸣、呼吸急促、咳嗽或干呕、张嘴呼吸或呕吐，从急性呼吸危机到长期低程度咳嗽都有；诊断需要排除支气管炎、肺虫等相似疾病。
  毛球页面也提醒，频繁“咳毛球”可能根本不是毛球，而是需要紧急治疗的哮喘等呼吸道疾病。
how_to_do_it:
  - 用手机录下咳嗽的样子：猫咳嗽时常低身、伸长脖子。
  - 记录发作频率和季节（花粉季可能加重）。
applies_to: [all]
urgency: important
related: [CG-0029, CG-0060]
scores:
