name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CJK fonts for the PDF
        run: sudo apt-get update -q && sudo apt-get install -yq fonts-noto-cjk
      - run: npm run check
      - name: Build PDF, EPUB, offline.html
        run: npm run build:exports -- --pdf
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Create GitHub release with downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp generated/guide.json dist/guide.json
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## \[" tag "\]" {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}" \
            dist/cost-effective-cat-guide.pdf dist/cost-effective-cat-guide.epub dist/offline.html dist/guide.json
