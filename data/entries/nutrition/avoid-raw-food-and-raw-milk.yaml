id: CG-0049
slug: avoid-raw-food-and-raw-milk
type: dont
title: 不要给猫吃生肉粮、生骨肉、冻干生肉和生牛奶
summary: 生肉和未经巴氏消毒的奶可能带有 H5N1 禽流感病毒、弓形虫和细菌。多起猫感染禽流感死亡与生肉猫粮有关，冻干生肉也不例外。
category: nutrition
tags: [raw-diet, bird-flu]
recommendation: 选择经过烹饪或加热处理的商品猫粮，不喂生肉、生骨肉、冻干生肉零食、生蛋和未经巴氏消毒的奶。关注猫粮召回信息。
why_it_matters: >-
  康奈尔大学猫健康中心指出，H5N1 禽流感可让猫严重发病，最多约 70% 的感染猫死亡；已知或怀疑的感染来源包括生牛奶、生肉和禽肉产品。美国已有多起猫感染与特定生肉猫粮有关，FDA 在病猫和它吃的生肉粮中检出相同基因型的病毒。康奈尔明确建议不要喂生肉（包括冻干生肉）食品和零食。
  此外，生肉是猫感染弓形虫最常见的途径之一，避免生肉饮食也是控制寄生虫的措施；FIV 阳性等免疫力低下的猫更要避免生肉、生蛋和未消毒的奶。
how_to_do_it:
  - 看配料和工艺：标注“生”“raw”“冻干生肉”的产品都属于生食。
  - 处理生肉后洗手，不让猫舔食处理台。
  - 关注当地和品牌的猫粮召回通知。
warning_signs:
  - 吃过生肉或生奶后发烧、不吃、精神差、呼吸困难、走路不稳、发抖、抽搐：立即联系兽医，先打电话再去，并把这只猫与其他宠物隔开。
applies_to: [all]
urgency: important
region_notes: H5N1 相关病例和召回目前主要报告于美国；其他地区的禽流感流行情况不同，但生肉带来的寄生虫和细菌风险各地都存在。
