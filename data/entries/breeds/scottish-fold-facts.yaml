evidence:
  level: B
  summary: 基因机制有研究证据和大样本基因检测数据支持；临床发病比例的研究结果不一致，因此标注证据冲突，本条不作购买或繁育建议。
  conflict: true
  conflict_notes:
    positions:
      - position: 折耳外形与骨软骨发育异常由同一显性变异导致，几乎所有折耳猫带有该变异；背景观点认为所有折耳猫都受影响。
        sources: [gandolfi-2016-scottish-fold-trpv4, anderson-2022-cat-genetic-epidemiology, velie-2023-scottish-fold-prevalence]
      - position: 在澳大利亚诊所病历中，被临床确诊的折耳猫比例相对较低（1,131 只中 12 只确诊、69 只疑似）。
        sources: [velie-2023-scottish-fold-prevalence]
    current_interpretation: 两者不矛盾地并存：基因上带变异不等于在病历里被诊断；病历研究可能低估了轻度或未被注意的病变。临床意义仍需更多研究。
  gaps:
    - "UNKNOWN: 折耳 × 折耳配种产生的后代是否更严重，本项目已读来源（摘要）没有直接说明。"
