id: CG-0020
slug: anesthesia-free-dental-cleaning
type: dont
title: 免麻洁牙不能代替兽医的麻醉下洁牙
summary: 不打麻醉时，没法检查和清洁牙龈线以下的部分，而牙周病主要就发生在那里。免麻洁牙看起来省钱又安全，但做不到这些。
category: dental
tags: [anesthesia-free-dental, dental]
recommendation: 需要洁牙时，选择兽医在全身麻醉下进行的口腔检查和洁治；不要用免麻洁牙代替。担心麻醉风险时，和兽医讨论麻醉前检查和麻醉方案。
why_it_matters: >-
  美国兽医牙科学院（AVDC）2024 年的立场声明指出：在不麻醉的动物身上，不可能清洁每颗牙齿的牙龈下区域，也不可能做完整的口腔检查；
  免麻刮牙不能代替麻醉下的完整牙科治疗。在清醒的动物嘴里使用尖锐器械，不符合减少动物恐惧和压力的做法，动物一动还可能伤到口腔组织。
  康奈尔大学猫健康中心也指出，洁治通常需要麻醉，牙科 X 光检查需要麻醉。只刮掉牙齿表面看得见的结石，不等于解决了牙周病。
how_to_do_it:
  - 让兽医检查口腔，判断是否需要洁牙。
  - 老年猫或有慢性病的猫，问兽医需要哪些麻醉前检查。
  - 洁牙后在家坚持刷牙（见 CG-0019）。
do_not:
  - 不要因为“不用麻醉更安全”就选择免麻洁牙。
applies_to: [adult, senior]
urgency: routine
related: [CG-0019]
scores:
  benefit: 3
  risk_reduction: 3
  money_cost: 0
  time_cost: 1
  effort: 1
  harm_potential: 0
  rationale: 避免花钱做无效处理，同时避免漏诊真正的牙病。
evidence:
  level: C
  summary: >-
    美国兽医牙科学院的立场声明明确反对免麻刮牙，大学兽医学院资料和 AAHA 指南的洁牙流程都以麻醉为前提。
    本条目前评为 C；纳入 AVDC 立场声明后，按本项目规则可考虑上调为 B，等待维护者确认（证据等级上调需人工确认）。
