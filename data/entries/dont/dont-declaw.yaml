id: CG-0104
slug: dont-declaw
type: dont
title: 不要给猫做去爪手术
summary: 去爪不是剪指甲，而是截掉脚趾最末端的骨头。它有麻醉、感染等手术风险，在兽医界争议很大。抓家具有更好的办法。
category: dont
tags: [scratching]
recommendation: 不把去爪当作解决抓挠的办法；用合适的猫抓板、定期剪指甲，必要时用指甲套。
why_it_matters: >-
  康奈尔大学猫健康中心指出，去爪是一种有很大争议的择期手术，名字听起来像拔指甲，实际上是截除脚趾末端的骨头；和其他手术一样，有麻醉并发症、感染等风险。
  同一页面给出了替代方法：按猫的偏好选择猫抓柱、放在常抓的位置、使用时奖励、定期剪指甲或使用指甲套。
region_notes: 一些国家和地区已经立法禁止非医疗原因的去爪手术。
applies_to: [all]
urgency: routine
related: [CG-0063]
