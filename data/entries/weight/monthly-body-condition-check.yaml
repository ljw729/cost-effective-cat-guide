id: CG-0011
slug: monthly-body-condition-check
type: recommendation
title: 在家定期称重和摸肋骨
summary: 肥胖是猫最常见的营养问题。每月称一次体重、摸一摸肋骨，比买任何减肥产品都更早发现问题。
category: weight
tags: [weight]
recommendation: 每月给猫称一次体重并记录，同时用体况评分（摸肋骨、看腰线）判断胖瘦；体重持续上升或下降时咨询兽医。
why_it_matters: >-
  康奈尔大学猫健康中心指出，肥胖是猫最常见的营养相关问题，会加重骨关节炎、糖尿病等问题。
  兽医常用 9 分制体况评分，4.5 到 5 分为理想体型，通过摸肋骨、侧面看腹部轮廓、从上方看腰线来判断。
  不明原因的体重下降同样值得注意，可能是疾病的早期信号。
how_to_do_it:
  - 人抱猫称重，减去人的体重；或用婴儿秤。每月同一时间称。
  - 记录在手机里，方便看趋势和给兽医看。
  - 摸肋骨：轻轻能摸到、但看不出来，通常比较理想；摸不到可能偏胖，肋骨很突出可能偏瘦。
  - 从上往下看，肋骨后面应该有轻微的腰线。
exceptions:
  - 长毛猫要用手摸，不能只看。
warning_signs:
  - 一两个月内体重明显下降，尤其同时吃得多或喝得多：尽快就医。
applies_to: [all, adult, senior]
urgency: routine
related: [CG-0012, CG-0010]
