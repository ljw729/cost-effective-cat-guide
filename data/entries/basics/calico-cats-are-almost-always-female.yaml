id: CG-0113
slug: calico-cats-are-almost-always-female
type: recommendation
title: 三花和玳瑁猫几乎都是母猫；少见的公猫通常不能生育
summary: 玳瑁（三花）花色由 X 染色体上的基因决定，所以通常只出现在母猫身上。罕见的玳瑁公猫多有额外的 X 染色体，通常没有生育能力。
category: basics
tags: [sex-differences, genetics]
recommendation: 看到三花或玳瑁猫，基本可以按母猫考虑（以兽医检查为准）。遇到玳瑁公猫，不要指望用它繁育；有异常时请兽医检查。
why_it_matters: >-
  一份病例报告的摘要说明：玳瑁花色通常只出现在母猫身上，因为决定橙色毛色的基因位于 X 染色体上；玳瑁公猫以低频率出现，原因是类似人类克氏综合征的染色体异常（39,XXY），多出的 X 染色体让它同时带有橙色和非橙色基因。该病例的睾丸检查显示没有精子生成，作者认为该猫不育。
how_to_do_it:
  - 判断性别以兽医检查为准，花色只能参考。
applies_to: [all]
