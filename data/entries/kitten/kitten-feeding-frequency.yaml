id: CG-0071
slug: kitten-feeding-frequency
type: recommendation
title: 幼猫一天三顿，半岁到一岁两顿，成年猫一到两顿
summary: 幼猫按体重需要更多食物。6 月龄前一天三顿，6 月龄到 1 岁一天两顿，成年后一天一到两顿通常就可以。
category: kitten
tags: [feeding, kitten]
recommendation: 6 月龄前每天喂三顿，6 月龄到 1 岁每天两顿，成年后每天一到两顿；选择适合生命阶段的全价猫粮。自由采食的干粮每天换新。
why_it_matters: >-
  康奈尔大学猫健康中心指出：幼猫每公斤体重需要更多食物，应该多餐；6 月龄前通常一天三顿最好，6 月龄到 1 岁一天两顿；约 1 岁成年后一天一到两顿适合大多数猫；10 岁以上的猫除非兽医另有指示，维持原来的喂法。
  自由采食干粮对有些猫可以，但对另一些猫会导致吃太多、体重增加；放着的食物每天要换新。
how_to_do_it:
  - 按包装上的生命阶段（幼猫 / 成猫）选择全价粮。
  - 每月称体重，按体况调整（见体况条目）。
applies_to: [kitten, adult]
