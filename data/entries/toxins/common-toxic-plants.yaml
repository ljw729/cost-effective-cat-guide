id: CG-0042
slug: common-toxic-plants
type: dont
title: 除了百合，这些常见植物也不要放在猫能碰到的地方
summary: 一品红、郁金香、毛地黄、喜林芋（蔓绿绒）、绣球、孤挺花、槲寄生、冬青等都对猫有毒。买花前先查一查。
category: toxins
tags: [toxic-plants]
recommendation: 养猫的家里优先选择确认对猫无毒的植物；有毒植物不要放在室内，或放在猫绝对接触不到的地方。不确定就先查 ASPCA 的有毒 / 无毒植物数据库。
why_it_matters: >-
  康奈尔大学猫健康中心列出的有毒植物包括一品红、百合、槲寄生、冬青、郁金香、毛地黄、喜林芋、孤挺花、满天星、须苞石竹、绣球等，并强调这只是一部分。
  对于一品红等常见观赏植物，猫只吃一小片叶子就可能生病，吃得多可能致命；百合尤其危险，极少量就能导致肾衰竭（见“家里不要放百合”条目）。
how_to_do_it:
  - 买花、收花前查一下品种名。
  - 花束里常混有多种植物，不确定的整束都不要放在家里。
  - 猫爱啃植物时，可以种猫草作为替代。
warning_signs:
  - 发现猫啃了不认识的植物后呕吐、流口水、精神差：联系兽医，带上植物或照片。
applies_to: [all]
urgency: important
related: [CG-0003, CG-0032]
