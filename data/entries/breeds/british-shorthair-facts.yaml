evidence:
  level: B
  summary: 血型比例和寿命来自两项大样本研究（均读了全文）；心肌肥厚易感来自大学兽医学院资料，没有给出英短的具体患病率。
  gaps:
    - "UNKNOWN: “金渐层”“银渐层”是国内对英短某些毛色的常用叫法，这只是命名说明；本项目没有找到这些毛色与疾病相关的研究。"
