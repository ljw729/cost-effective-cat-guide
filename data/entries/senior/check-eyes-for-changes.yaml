id: CG-0041
slug: check-eyes-for-changes
type: recommendation
title: 定期看看猫的眼睛：瞳孔不一样大、眼睛变浑要就医
summary: 很多“突然失明”其实是慢慢发生、主人突然才发现，常见于有高血压的老年猫。早发现有可能保住视力。
category: senior
tags: [vision, blood-pressure]
recommendation: 每周看一看猫的两只眼睛：虹膜颜色、是否浑浊、两侧瞳孔是否一样大。发现变化，或猫开始撞家具、找不到食盆，尽快就医。
why_it_matters: >-
  康奈尔大学猫健康中心的眼科专家指出，真正的“突然失明”比较少见，更常见的是“突然才被发现的失明”：老年猫长期高血压导致视网膜脱落和眼内出血，视力逐渐下降，主人直到最后才注意到。
  早期治疗高血压有时能让视网膜重新贴合、恢复部分视力；等到完全失明再就医，大多数猫无法恢复。2017 ISFM 高血压指南也把失明和双侧瞳孔散大列为严重眼部损害的表现。
how_to_do_it:
  - 在光线充足的地方，看两只眼睛是否一样亮、一样清澈，瞳孔是否一样大。
  - 老年猫按年龄定期量血压（见“老年猫量血压”条目）。
warning_signs:
  - 两侧瞳孔大小不一，或在亮处也一直很大
  - 眼睛变浑浊、虹膜颜色改变
  - 撞家具、找不到食盆、受惊时僵在原地
