id: CG-0016
slug: regular-checkups-even-indoor
type: recommendation
title: 室内猫也要定期体检，年纪越大越频繁
summary: 猫很会隐藏不适，不出门也会生病。定期体检能早发现问题，随着年龄增长，检查要更频繁。
category: prevention
tags: [checkup, hidden-illness]
myth_claim: 猫不出门就不需要看兽医
recommendation: 按猫的生命阶段定期带它做健康检查；室内猫也一样。进入老年后，检查和化验要更频繁。
why_it_matters: >-
  2021 年 AAHA/AAFP 猫生命阶段指南把猫的一生分为幼猫、青年、成年、老年和临终五个阶段，并为每个阶段给出体检内容的框架，
  涵盖行为与环境、排泄、营养与体重、口腔、寄生虫、疫苗和化验等。指南专门讨论了如何克服带猫看兽医的障碍，因为这是猫医疗中最难的部分之一。
  2021 年 AAFP 老年猫指南建议随着年龄增长增加检查频率，并把血压测量列为老年猫（包括看起来健康的猫）的基础检查项目。
how_to_do_it:
  - 和兽医讨论适合你家猫的体检频率。
  - 平时记录体重、食欲、喝水、猫砂盆情况，体检时带上（见 CG-0028）。
  - 提前训练猫适应航空箱，可以减少就医压力。
exceptions:
  - 已有慢性病的猫按兽医制定的复诊计划。
applies_to: [all, indoor, adult, senior]
urgency: important
related: [CG-0018, CG-0028]
scores:
  benefit: 4
  risk_reduction: 4
  money_cost: 3
  time_cost: 2
  effort: 2
  harm_potential: 0
  rationale: 能早发现疾病；需要每年花钱和时间。
evidence:
  level: B
  summary: >-
    两份 AAFP 系列指南支持按生命阶段定期体检，老年猫增加频率。这是专家共识，没有随机研究比较不同体检频率的健康结局。
  gaps:
    - "NEED REVIEW: “成年猫至少每年一次”“老年猫每 6 个月一次”这样的具体频率，第一轮只读到摘要，尚未在指南全文中核对，所以正文没有写死数字。"
