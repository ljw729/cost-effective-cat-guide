id: CG-0101
slug: always-use-a-carrier
type: recommendation
title: 带猫出门一定装进航空箱，并且让猫戴好身份标识
summary: 很多“室内猫走失”发生在去医院的路上：受惊挣脱、车门打开或车祸时跑掉。航空箱能防止大多数这类意外。
category: travel
tags: [carrier, microchip]
recommendation: 带猫去医院、搬家、旅行时都装进结实、关得牢的航空箱，不要抱着出门；猫平时戴安全扣项圈和身份牌，最好植入芯片并更新登记信息。
why_it_matters: >-
  康奈尔大学猫健康中心指出，室内猫可能在被带出门（例如去医院）时受惊逃跑，也有猫在车祸中意外脱离主人，而航空箱能防止大多数这类意外逃脱。
  应急准备页面建议猫随时戴安全扣项圈和身份牌，并考虑植入芯片作为永久标识。
how_to_do_it:
  - 平时把航空箱放在家里当窝，里面放猫熟悉的毯子，让猫不怕它。
  - 出门前检查箱门和卡扣。
  - 在车里把航空箱固定好。
applies_to: [all]
urgency: important
related: [CG-0002, CG-0028]
