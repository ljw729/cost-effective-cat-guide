id: CG-0014
slug: litter-box-number-and-placement
type: recommendation
title: 猫砂盆够数、分开放、每天铲
summary: 很多“乱尿”和猫砂盆有关。猫砂盆要够数，分散放在安静、好到达的地方，每天清理。这件事几乎不花钱。
category: litter
tags: [litter-box, multicat]
recommendation: >-
  单猫家庭准备两个猫砂盆，放在两个不同的地方。多猫家庭常用的经验法则是“猫砂盆比猫多一个”，但更重要的是分散放置，
  让每一群关系好的猫都有自己的如厕点；关系不好的猫要有各自的猫砂盆。每天至少铲一次。
why_it_matters: >-
  2014 年 AAFP/ISFM 乱尿行为指南建议：单猫家庭放两个猫砂盆在两个地方；多猫家庭“至少比猫多一个”是历来的经验法则，但不是硬性要求。
  关系好的猫可能愿意共用，关系不好的猫应有各自的如厕点；多层住宅每层至少一个。挨在一起的几个猫砂盆，在猫看来只是一个大盆。
  2024 年 AAFP 猫间紧张关系指南补充：多猫家庭里平均每只猫能用到的资源往往更少，冲突风险更高；指南中的病例显示，一只猫被其他猫堵在走廊和楼梯上，去不了放猫砂盆的房间，结果在别处排尿。
how_to_do_it:
  - 放在安静、容易到达的地方，远离食物和水；不要放在洗衣机旁等会突然有噪音的地方。
  - 不要把几个猫砂盆并排放；如果必须放得近，开口不要相对，最好成直角或隔一个拐角，方便猫离开时避开另一只猫。
  - 多层住宅每层至少放一个。
  - 每天至少铲一次，按需添砂；每 1 到 4 周整盆清洗一次，用肥皂和热水，不要用刺激性化学品或含氨的产品。
  - 一个猫砂盆一直没人用，在其他盆有猫在用的前提下可以撤掉。
exceptions:
  - 老年猫或关节不好的猫需要低入口、容易进出的猫砂盆。
warning_signs:
  - 猫突然开始在猫砂盆外排泄，先排除疾病。尤其是公猫频繁蹲盆却没尿，见 CG-0007。
applies_to: [all, multi-cat]
urgency: important
related: [CG-0015, CG-0007, CG-0027]
scores:
  benefit: 4
  risk_reduction: 2
  money_cost: 1
  time_cost: 2
  effort: 1
  harm_potential: 0
  rationale: 减少乱尿和猫之间的紧张关系；多买一个猫砂盆的成本很低。
evidence:
  level: B
  summary: >-
    两份 AAFP 系列指南都支持资源充足、分散放置。2014 年指南本身说明相关研究常常缺乏，部分建议来自作者的临床经验；
    指南把“比猫多一个”明确称为历来的经验法则、不是硬性要求。
