id: CG-0124
slug: sphynx-and-devon-rex
type: recommendation
title: 斯芬克斯（无毛猫）和德文卷毛猫：心肌肥厚常见、遗传性肌病、B 型血较多
summary: 新西兰一项研究中 40% 看起来健康的斯芬克斯猫有肥厚型心肌病。两个品种都有一种遗传性肌无力。英国数据中斯芬克斯平均寿命最短（样本很小）。
category: breeds
tags: [sphynx, heart-disease, genetics, blood-type]
recommendation: 养斯芬克斯猫，和兽医讨论定期心脏超声检查；留意肌无力、吞咽困难；德文卷毛和斯芬克斯繁育前要做血型检测。需要输血或手术时告诉兽医品种。
why_it_matters: >-
  新西兰一项研究对 55 只看起来健康的斯芬克斯猫做心脏检查，中位年龄 5.8 岁时 40%（20 只）患有肥厚型心肌病，研究期间 3 只死于充血性心衰；一个曾被认为相关的基因变异（ALMS1）与诊断并无关联，所以目前没有可靠的基因检测能排除。
  一项研究发现 COLQ 基因变异与德文卷毛猫和斯芬克斯猫的遗传性肌病相关，表现为四肢和躯干肌无力、巨食道、咽部无力、运动后易疲劳。
  基因检测研究显示德文卷毛猫中 B 型血约占 30.3%。英国寿命表研究中斯芬克斯猫出生时预期寿命 6.68 年，是 12 个品种中最短的，但只有 18 例死亡，置信区间很宽。
warning_signs:
  - 呼吸急促或张嘴呼吸：立即就医
  - 后腿突然瘫痪：立即急诊
  - 吃东西时呛咳、反流、低头无力
