id: CG-0039
slug: behavior-change-is-a-health-signal
type: recommendation
title: 行为突然变了，先想到可能是生病，不要只当成“老了”或“闹脾气”
summary: 躲起来、不爱玩、变凶、乱尿、不理毛，可能是疼痛或疾病的表现。猫很会掩饰生病。
category: early-signs
tags: [hidden-illness, behavior-change]
recommendation: 猫的行为或日常习惯出现明显变化时，先带去兽医检查身体，排除疼痛和疾病，再考虑行为问题。
why_it_matters: >-
  康奈尔大学猫健康中心反复强调：猫很擅长掩饰疾病，常常到病情很重才表现出来；不要把老年猫的变化都当成“只是老了”。
  具体例子包括：牙病或关节炎的疼痛会让猫变得有攻击性；关节炎会让猫难以进出猫砂盆；甲亢、牙病、神经系统问题可能导致攻击行为；躲藏、不再晒太阳、不爱玩可能是癌症等疾病的早期信号；不理毛也提示身体不舒服。
how_to_do_it:
  - 记下变化开始的时间和具体表现，拍视频（见“就医前记录变化”条目）。
  - 先排除身体原因，再找行为方面的办法。
  - 不要因为猫“变坏了”而惩罚它，惩罚会加重恐惧和攻击。
warning_signs:
  - 比平时躲得多、不想互动
  - 不再跳上常去的高处
  - 突然变凶、碰到某处就咬
  - 毛变得杂乱、油腻、打结
  - 突然在猫砂盆外排泄
applies_to: [all, senior]
urgency: important
related: [CG-0028, CG-0037]
scores:
  benefit: 4
  risk_reduction: 3
  money_cost: 2
  time_cost: 1
  effort: 1
  harm_potential: 0
