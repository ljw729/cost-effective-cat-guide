id: CG-0120
slug: persian-and-exotic
type: recommendation
title: 波斯猫和异国短毛（加菲）：毛发、眼睛、牙齿和呼吸要多照顾
summary: 英国数据中波斯猫最常见的问题是毛发问题、牙周病、指甲过长和眼睛分泌物。脸越扁，呼吸、流泪和牙齿问题越常见；极度扁脸还与头骨畸形有关。
category: breeds
tags: [persian, brachycephalic, genetics]
recommendation: 波斯猫和异国短毛猫：每天梳毛、清洁眼周分泌物、定期检查牙齿和修剪指甲；留意睡觉打鼾、活动后呼吸费力；购买前要求父母猫做多囊肾（PKD1）基因检测。
why_it_matters: >-
  英国全科兽医记录研究（3,235 只波斯猫）显示：最常见的问题是毛发问题（12.7%）、牙周病（11.3%）、指甲过长（7.2%）和眼睛分泌物（5.8%）；中位寿命 13.5 年；最常见死因是肾病（23.4%）。
  一项 1,000 份主人问卷研究发现，脸越扁（鼻子位置越高、口鼻越短），主人报告的呼吸问题评分越高，并与流泪痕迹相关。
  一项 50 只波斯和异国短毛猫的口腔检查发现，72% 咬合不正、56% 牙齿拥挤、88% 有牙周病、70% 有牙齿吸收。
  一项 CT 研究发现，极度扁脸（“京巴脸”）的波斯猫头骨、面骨和牙齿畸形更多，并与脑室扩张（脑积水）相关，作者建议重新考虑选育极度扁脸。
  波斯猫中曾有约 40% 携带导致多囊肾的 PKD1 变异；引入基因检测后，该变异频率已明显下降。
how_to_do_it:
  - 每天梳毛，防止打结。
  - 每天用湿棉球轻擦眼角分泌物。
  - 每年请兽医检查口腔，必要时拍牙片。
  - 天热时注意通风降温（见中暑条目）。
warning_signs:
  - 安静时也张嘴呼吸、呼吸费力：立即就医
  - 眼睛眯起、发红、角膜发白
  - 喝水尿量增多（多囊肾和慢性肾病）
applies_to: [all]
urgency: important
