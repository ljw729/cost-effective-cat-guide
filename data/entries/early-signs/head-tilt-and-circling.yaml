id: CG-0085
slug: head-tilt-and-circling
type: recommendation
title: 猫突然歪头、转圈、站不稳、眼球乱颤：当天联系兽医
summary: 这些是平衡系统（前庭）出问题的表现。原因可能是不明原因的暂时性前庭病，也可能是耳朵感染、肿瘤或中毒，需要检查区分。
category: early-signs
tags: [neurological]
recommendation: 猫突然歪头、向一侧转圈或摔倒、眼球快速来回颤动、面部下垂时，当天联系兽医。在家把猫放在安全、不会摔伤的地方，帮它吃喝。
why_it_matters: >-
  康奈尔大学猫健康中心指出：前庭疾病最常见的表现是转圈或向一侧摔倒、明显歪头和眼球震颤；如果中耳或内耳有肿瘤或炎症，还可能出现面部下垂。
  不明原因的前庭病会突然出现、几天内逐渐好转，多数猫两三周内完全恢复；但继发于感染、肿瘤或中毒的情况需要治疗原发病，所以需要兽医做神经和耳部检查来区分。
  期间要把猫关在安全的地方防止受伤，可能需要辅助喂食和补液。
