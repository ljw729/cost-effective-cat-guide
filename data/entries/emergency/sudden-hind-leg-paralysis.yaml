id: CG-0034
slug: sudden-hind-leg-paralysis
type: emergency
title: 后腿突然瘫软、剧痛：立即急诊
summary: 猫突然后腿拖地、不能动或疼得叫，可能是心脏病形成的血栓堵住了后腿血管，是急症。
category: emergency
tags: [heart-disease]
recommendation: 猫突然出现后腿无力、拖行、瘫痪或明显疼痛时，立即去急诊。
why_it_matters: >-
  康奈尔大学猫健康中心指出，肥厚型心肌病是猫最常见的心脏病，很多患病的猫看起来完全正常。
  它的严重后果之一是心脏里形成血栓，血栓最常堵住后腿的血流，造成后腿突然剧痛，严重时瘫痪。这类表现提示预后较差，需要立即治疗。
emergency_action:
  - 立即联系急诊。
  - 用毛巾托住身体，放进航空箱，尽量不碰疼痛的后腿。
do_not:
  - 不要以为是“扭到了”而在家观察。
  - 不要给人用止痛药。
warning_signs:
  - 后腿突然无力、拖着走或完全不能动
  - 突然尖叫、明显疼痛
  - 同时呼吸急促或张嘴呼吸
applies_to: [all, adult, senior]
urgency: emergency
related: [CG-0029, CG-0033]
