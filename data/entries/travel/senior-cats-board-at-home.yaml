id: CG-0069
slug: senior-cats-board-at-home
type: recommendation
title: 出远门时，老年猫最好请人上门照顾，而不是送去寄养
summary: 老年猫适应变化的能力下降。出差旅行时，请邻居、朋友或家人上门照顾，通常比去陌生的寄养环境更好。
category: travel
tags: [senior, boarding]
recommendation: 主人外出时，优先安排可靠的人上门喂养老年猫；必须寄养时，带上猫熟悉的毯子或玩具，并把健康情况和用药写清楚交给照顾者。
why_it_matters: >-
  康奈尔大学猫健康中心指出，老年猫通常更难适应变化，减少环境压力非常重要；必须寄养时，带上熟悉的物品可能减少不安，而更好的选择是请邻居、朋友或亲属在家照顾。
  康奈尔的厌食页面也指出，猫在寄养环境中拒食相对常见，而猫不吃东西本身就有风险。
how_to_do_it:
  - 写一张照顾清单：喂食量、用药、兽医电话、异常情况怎么处理。
  - 请照顾者每天确认猫吃了、喝了、上了厕所。
