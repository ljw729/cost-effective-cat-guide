id: CG-0037
slug: drinking-and-peeing-more
type: recommendation
title: 喝水变多、尿变多：尽快查血查尿
summary: 猫突然比以前喝得多、尿团变大变多，是慢性肾病、糖尿病、甲亢等常见病的早期信号，尤其是中老年猫。
category: early-signs
tags: [drinking-more, kidney-disease, hidden-illness]
recommendation: 发现猫喝水明显变多、猫砂结团变大或变多，预约兽医做血液和尿液检查；同时有体重下降时更要尽快。
why_it_matters: >-
  康奈尔大学猫健康中心的三篇疾病页面都把“多饮多尿”列为主人在家最能发现的信号：
  慢性肾病影响 10 岁以上猫的约 40%、15 岁以上猫的约 80%，早期常没有明显症状，之后会尿多、喝多；糖尿病最常见的两个信号是“吃得多却变瘦”和多饮多尿；甲亢的常见信号是体重下降、食欲增加、多饮多尿。
  这些病越早发现，越好控制。
how_to_do_it:
  - 固定用同样大小的水碗，留意每天要加多少水。
  - 铲屎时留意尿团数量和大小的变化。
  - 去医院时最好带上新鲜尿样，或按兽医指导用不吸水的猫砂收集。
warning_signs:
  - 喝水明显变多，水碗空得快
  - 尿团变大变多，猫砂消耗变快
  - 同时吃得多却变瘦
  - 在猫砂盆外排尿（尿量变多也可能导致这种情况）
applies_to: [all, adult, senior]
urgency: important
related: [CG-0016, CG-0018, CG-0038]
