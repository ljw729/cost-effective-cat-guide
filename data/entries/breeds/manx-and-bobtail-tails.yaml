id: CG-0132
slug: manx-and-bobtail-tails
type: recommendation
title: 曼岛猫（无尾猫）和短尾品种：短尾来自基因变异
summary: 研究发现 95% 的短尾曼岛猫带有 T 基因的一份变异，美国短尾猫和北美短尾猫中也有相同变异。关于无尾对健康的影响，本项目还没有找到可读的可靠研究。
category: breeds
tags: [manx, genetics]
recommendation: 养曼岛猫或短尾品种，向兽医说明品种；留意排便排尿异常和后腿无力，发现时尽快就医。
why_it_matters: >-
  一项基因研究在曼岛猫中发现了 T 基因（Brachyury）的多个变异，95% 的短尾曼岛猫带有一份这样的变异；其中一个变异也见于近年在美国培育的美国短尾猫和北美短尾猫。研究认为 T 基因功能减半是家猫尾长差异的一种机制。
  本项目没有读到关于曼岛猫脊柱、排便或神经问题的可靠研究，所以不在正文中写发生率。
