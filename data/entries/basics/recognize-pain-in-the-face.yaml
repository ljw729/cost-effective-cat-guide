evidence:
  level: C
  summary: 量表本身经过验证，但验证针对的是兽医环境中的急性疼痛、由受训者评分；主人在家使用的准确性没有研究，因此本条评为 C。
  gaps:
    - "UNKNOWN: 主人在家观察面部表情识别疼痛的准确性。"
    - "UNKNOWN: 五个动作的具体描述（如“胡须变直前伸”）来自量表的通用说明，本项目只读了论文摘要。"
