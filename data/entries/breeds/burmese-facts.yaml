id: CG-0125
slug: burmese-facts
type: recommendation
title: 缅甸猫：寿命较长，但糖尿病和低钾性肌病风险较高
summary: 英国数据中缅甸猫平均寿命约 14.4 年，是最长的品种之一。但它的糖尿病风险高于混种猫，还有一种遗传性低钾导致的周期性肌无力，常在 1 岁内出现。
category: breeds
tags: [burmese, genetics, diabetes]
recommendation: 养缅甸猫：控制体重，留意喝水尿量变多和体重下降（糖尿病）；幼猫出现阵发性无力、低头时尽快就医；购买前询问父母猫的低钾血症基因检测。
why_it_matters: >-
  英国寿命表研究中，缅甸猫出生时预期寿命 14.42 年，在 12 个品种类别中最长。
  英国一项 120 多万只猫的研究发现，缅甸猫患糖尿病的几率约是混种猫的 2 倍（波米拉猫约 8 倍）；澳大利亚研究指出，在澳大利亚和欧洲，缅甸猫的糖尿病约比其他品种常见 4 倍。
  一篇综述介绍，低钾性多发性肌病是缅甸猫的遗传病，患猫通常在 1 岁内出现肌无力和肌肉疼痛，常呈阵发性，典型表现是低头（颈部向下弯曲）。基因检测研究显示该变异在缅甸猫中的频率已下降。
  一项瑞典研究指出缅甸猫和孟加拉猫似乎易发胸廓畸形。
warning_signs:
  - 幼猫突然无力、低头抬不起来
  - 喝水尿量增多、吃得多却变瘦
