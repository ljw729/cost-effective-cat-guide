id: CG-0033
slug: never-give-human-painkillers
type: dont
title: 绝不要给猫吃人用止痛药和感冒药
summary: 对乙酰氨基酚（扑热息痛、泰诺）、布洛芬、阿司匹林等人用药是猫中毒的常见原因。药片掉在地上也要捡干净。
category: toxins
tags: [human-medication]
recommendation: 不给猫吃任何人用药，除非兽医明确开具。药品放在猫拿不到的柜子里，掉在地上的药片立刻捡起来。
why_it_matters: >-
  康奈尔大学猫健康中心转引 ASPCA 动物中毒控制中心的数据：人用药是猫中毒最常见的原因之一，其中最突出的是阿司匹林、对乙酰氨基酚和布洛芬，以及部分感冒药、抗抑郁药和营养补充剂。
  猫会吞下放在床头柜、桌面或掉在地上的药片。康奈尔的绝育页面也特别提醒：术后不要自行给猫用这些非处方止痛药。
how_to_do_it:
  - 所有药品（包括维生素和保健品）放进有门的柜子。
  - 吃药时不要把药片放在桌边；掉了马上找到。
  - 猫看起来疼痛时，联系兽医，不要用家里的止痛药。
warning_signs:
  - 发现猫可能吃了人用药：立即联系兽医（见“怀疑猫中毒”条目）。
applies_to: [all]
urgency: important
related: [CG-0032]
scores:
