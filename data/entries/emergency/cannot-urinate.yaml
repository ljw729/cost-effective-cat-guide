evidence:
  level: B
  summary: >-
    大学兽医学院的资料明确把尿道堵塞列为急症；病例对照研究给出了死亡率和复发率。
    这些数字来自单一医院，不同医院和治疗方式下会有差别。
  gaps:
    - 尚未纳入 FLUTD 或尿道堵塞的指南级来源。
