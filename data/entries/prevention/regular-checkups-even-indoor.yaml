id: CG-0016
slug: regular-checkups-even-indoor
type: recommendation
title: 室内猫也要每年体检，老年猫每半年一次
summary: 猫很会隐藏不适，不出门也会生病。所有猫至少每年体检一次，10 岁以上的老年猫至少每 6 个月一次。
category: prevention
tags: [checkup, hidden-illness]
myth_claim: 猫不出门就不需要看兽医
recommendation: 所有猫（包括室内猫）至少每年做一次健康检查；10 岁以上的老年猫至少每 6 个月一次；有慢性病的猫按兽医的复诊计划，通常更频繁。
why_it_matters: >-
  2021 年 AAHA/AAFP 猫生命阶段指南建议所有猫至少每年体检一次，并按个体需要增加频率；老年猫至少每 6 个月一次，有慢性病的更频繁。
  指南把猫的一生分为幼猫（不满 1 岁）、青年（1 到 6 岁）、成年（7 到 10 岁）、老年（10 岁以上）和临终阶段，
  并为每个阶段列出体检内容，包括行为与环境、排泄、营养与体重、口腔、寄生虫、疫苗和化验。
  指南专门讨论了如何克服带猫看兽医的障碍，因为这是猫医疗中最难的部分之一。
  2021 年 AAFP 老年猫指南建议随年龄增长增加检查频率，并把血压测量列为老年猫（包括看起来健康的猫）的基础检查项目。
how_to_do_it:
  - 把体检日期和疫苗一起记在日历里。
  - 平时记录体重、食欲、喝水、猫砂盆情况，体检时带上（见 CG-0028）。
  - 提前训练猫适应航空箱，可以减少就医压力。
exceptions:
  - 已有慢性病的猫按兽医制定的复诊计划。
applies_to: [all, indoor, adult, senior]
urgency: important
related: [CG-0018, CG-0028]
scores:
  benefit: 4
  risk_reduction: 4
  money_cost: 3
  time_cost: 2
  effort: 2
  harm_potential: 0
  rationale: 能早发现疾病；需要每年花钱和时间。
evidence:
  level: B
  summary: >-
    两份 AAFP 系列指南给出了明确的体检频率，属于专家共识；没有随机研究比较不同体检频率的健康结局。
    两份指南的编写都得到了动物药企、诊断和宠物食品企业的教育资助（见来源的利益冲突说明）。
