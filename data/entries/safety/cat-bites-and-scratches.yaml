id: CG-0090
slug: cat-bites-and-scratches
type: recommendation
title: 被猫咬伤要认真处理，必要时看医生
summary: 70% 到 90% 的猫嘴里带有巴斯德菌，严重的猫咬伤可在 24 到 48 小时内红肿疼痛。约 40% 的猫携带引起猫抓病的细菌。
category: safety
tags: [rabies, zoonotic]
recommendation: 被猫咬伤或抓伤后立即用肥皂和清水冲洗伤口；咬伤较深、红肿加重、发热或淋巴结肿痛时及时就医，并告知医生是猫咬伤。不让孩子和猫粗暴玩耍；控制跳蚤。
why_it_matters: >-
  康奈尔大学猫健康中心指出：70%–90% 的猫口腔中有巴斯德菌，在严重到需要就医的猫咬伤中有 50%–80% 检出；感染的咬伤常在 24–48 小时内出现疼痛、红肿。
  约 40% 的猫感染引起猫抓病的巴尔通体，多数猫没有症状，用抗生素不能可靠清除，也不推荐；预防靠避免抓咬（例如不让孩子粗暴地和猫玩）、和猫玩后洗手、控制跳蚤。
  另见“室内猫也要打狂犬疫苗”条目：咬伤人还涉及狂犬病的处理规定。
how_to_do_it:
  - 家里常备肥皂，咬伤后马上冲洗几分钟。
  - 免疫力低下的人被抓咬后尽早看医生。
applies_to: [all]
urgency: important
region_notes: 被动物咬伤后是否需要接种人用狂犬疫苗，请按当地卫生部门和医生的意见处理。
related: [CG-0052, CG-0057]
