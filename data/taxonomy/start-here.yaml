# “新手先看”：从已有条目中挑出的最重要的几件事，按顺序展示在网站首页、GUIDE.md、PDF 和离线版的最前面。
# 只引用条目编号，不写新的医学内容；note 只是一句导读。
- id: CG-0001
  note: 防坠楼，花钱少、救命
- id: CG-0003
  note: 百合对猫极毒，最便宜的预防是家里不放
- id: CG-0033
  note: 人用止痛药、感冒药对猫有毒
- id: CG-0005
  note: 狗用驱虫药可能毒死猫
- id: CG-0035
  note: 不吃东西不是挑食，要算时间
- id: CG-0115
  note: 记下睡眠呼吸频率，异常时能早发现
- id: CG-0016
  note: 室内猫也要每年体检
- id: CG-0017
  note: 核心疫苗都要打
- id: CG-0056
  note: 不繁育就早绝育
- id: CG-0008
  note: 主食选全价粮
- id: CG-0011
  note: 每月称重、摸肋骨，防肥胖也防暗病
- id: CG-0014
  note: 猫砂盆是很多问题的起点
- id: CG-0022
  note: 室内猫需要玩耍和安全感
