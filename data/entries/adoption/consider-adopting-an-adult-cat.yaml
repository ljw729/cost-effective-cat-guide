id: CG-0080
slug: consider-adopting-an-adult-cat
type: recommendation
title: 领养时也考虑成年猫和老年猫
summary: 成年猫性格已经稳定，你更容易知道它是否适合你的家；收容所里的老年猫通常更安静、已经会用猫砂盆，却最容易被忽视。
category: adoption
tags: [adoption]
recommendation: 领养前想清楚自己的生活方式：精力充沛的幼猫需要更多陪伴和训练；性格稳定的成年猫、老年猫往往更省心。选猫时看眼睛是否清亮、鼻子耳朵是否干净、是否愿意和人互动。
why_it_matters: >-
  康奈尔大学猫健康中心指出：幼猫好奇活泼，你可以影响它的性格发展；成年猫性格已经定型，你更清楚它能否适应你的家，健康成年猫通常需要的照顾更少。
  收容所里的老年猫常被忽视，但它们通常更安静、更可能已经会用猫砂盆。
  选猫时，健康的猫眼睛清亮、少泪，鼻孔干净，耳内无分泌物（黑色焦油样分泌物常提示耳螨），愿意与人亲近；经常躲藏或异常嗜睡的猫要注意。
