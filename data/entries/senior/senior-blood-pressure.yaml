id: CG-0018
slug: senior-blood-pressure
type: recommendation
title: 老年猫体检时要量血压
summary: 高血压在老年猫中很常见，常伴随慢性肾病或甲亢，平时很难察觉。老年猫每次体检都请兽医量血压，包括看起来健康的猫。
category: senior
tags: [senior, blood-pressure]
recommendation: 猫 7 岁以后至少每年测一次血压，11 岁以后每 6 到 12 个月测一次；有慢性肾病、甲亢等风险因素的猫，按兽医要求更频繁地测。
why_it_matters: >-
  ISFM 共识指南指出，高血压在老年猫中常见，常与慢性肾病、甲亢同时出现，会损害眼睛、心脏和血管、大脑和肾脏，而且损害可能不可逆。
  临床上很少常规测量血压，导致高血压可能被漏诊。指南建议：健康的 7 到 10 岁猫至少每年测一次，11 岁及以上至少每 6 到 12 个月测一次；
  有风险因素的猫应立即测量，并至少每 3 到 6 个月复查。2021 年 AAFP 老年猫指南也建议 10 岁以上的猫每次体检都测血压。
  严重的眼部损害常表现为突然失明、双侧瞳孔放大，往往已不可逆；15% 到 46% 的高血压猫出现神经症状，如迷失方向、抽搐、走路不稳。
how_to_do_it:
  - 老年猫体检时，主动问兽医是否需要测血压。
  - 测量前让猫在安静环境里适应一会儿，结果更可靠。
warning_signs:
  - 突然看不见东西、走路撞墙、双眼瞳孔明显放大：尽快就医。
  - 迷失方向、抽搐、走路不稳：尽快就医。
applies_to: [senior]
urgency: important
related: [CG-0016]
scores:
