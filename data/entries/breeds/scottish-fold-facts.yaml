id: CG-0118
slug: scottish-fold-facts
type: recommendation
title: 苏格兰折耳猫：折耳和骨软骨发育异常来自同一个基因变异
summary: 研究发现，折耳外形和四肢、尾巴的骨软骨发育异常都与同一个显性基因变异有关。但一项澳大利亚病历研究中，确诊为该病的折耳猫比例不高。以下只列事实，由你自己判断。
category: breeds
tags: [scottish-fold, genetics]
recommendation: 养折耳猫，或考虑买折耳猫时，了解以下事实；已经养了折耳猫，留意跛行、不愿跳、尾巴僵硬，定期请兽医检查四肢关节和尾巴，疼痛时及早处理。
why_it_matters: >-
  事实一：一项基因研究发现，苏格兰折耳猫显性遗传的折耳外形和骨软骨发育异常（累及前后肢远端和尾巴，关节进行性破坏）都与 TRPV4 基因的同一个变异有关；该变异在 648 只未受影响的猫中均未发现。
  事实二：一项对 11,036 只猫的基因检测中，72/76 只（94.7%）苏格兰折耳短毛猫带有这个变异。
  事实三：一项澳大利亚研究回顾了 1,131 只折耳猫的诊所病历，只有 12 只被临床确诊、另有 69 只疑似（含少数立耳苏格兰猫）；确诊多在 30 个月龄以前，公母比例相当。作者认为临床确诊比例相对较低，但仍需更多证据评估其临床意义。
  事实四：该研究的背景介绍写明，人们普遍认为所有折耳猫都受骨软骨发育异常影响，这是一种疼痛的退行性关节病。
  事实三和事实四之间存在差异，可能与“基因上受影响”和“在病历中被诊断”不是一回事有关。
how_to_do_it:
  - 留意：走路僵硬、跛行、不愿跳高、尾巴粗短僵硬、不让碰腿或尾巴。
  - 向兽医说明猫是折耳猫，请检查四肢和尾巴。
warning_signs:
  - 跛行、不愿跳、活动明显减少
  - 尾巴僵硬、碰尾巴或腿时疼痛
applies_to: [all]
