evidence:
  level: B
  summary: >-
    寿命差异来自英国两项基于全科兽医记录的大样本研究（一项读了全文）；公猫与心肌肥厚的关联来自一项横断面研究摘要；其余来自大学兽医学院资料。寿命数据是英国的，不一定适用于其他地区。
  gaps:
    - "UNKNOWN: “品种 × 性别”的组合差异（例如某个品种的公猫是否特别容易得某病），目前只找到零散数据，例如折耳猫骨软骨发育异常的公母比例相同；本项目不编制品种 × 性别对照表。"
