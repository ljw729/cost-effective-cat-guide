id: CG-0032
slug: suspected-poisoning
type: emergency
title: 怀疑猫中毒：马上打电话，不要自己催吐
summary: 怀疑猫吃了有毒的东西时，立即联系兽医或动物中毒热线，带上包装或样品。不要自行催吐，有些毒物吐出来伤害更大。
category: emergency
tags: [poisoning]
recommendation: 怀疑中毒时，立即联系兽医；联系不上就找急诊或动物中毒咨询热线。保留毒物包装或样品。除非兽医明确要求，不要自己催吐。
why_it_matters: >-
  康奈尔大学猫健康中心指出：等主人发现异常时，猫可能已经有严重风险，因此要立即咨询兽医；有些毒物在呕吐时造成的损伤比留在胃里更大，所以除非专业人员明确指示，不要催吐。
  中毒常见表现包括呕吐、腹泻、抽搐、流口水、走路不稳、呼吸困难、尿不出来等。
emergency_action:
  - 立即联系兽医；联系不上就找急诊或当地的动物中毒咨询热线。
  - 说清楚：可能吃了什么、大概多少、多久以前、猫现在的表现。
  - 带上包装、标签或剩下的样品去医院。
do_not:
  - 不要自行催吐（不要灌盐水、双氧水等）。
  - 不要喂牛奶、油或“解毒”偏方。
  - 不要等症状出现才行动。
warning_signs:
  - 呕吐、腹泻、流口水
  - 走路不稳、发抖、抽搐
  - 突然精神很差、不吃东西
  - 呼吸困难、心跳不规律
  - 尿不出来、尿或便中带血、牙龈出血或鼻出血
applies_to: [all]
urgency: emergency
region_notes: 来源中的中毒热线是美国的（ASPCA、Pet Poison Helpline）。中国大陆目前没有确认可靠的全国性宠物中毒热线，请提前存好附近 24 小时动物医院的电话。
