id: CG-0079
slug: new-cat-basic-supplies
type: buying_guide
title: 新猫到家前只需要准备这几样：猫砂盆、猫砂、食物、水碗、猫抓板
summary: 不用一次买齐“养猫全套”。猫砂盆选简单无盖的，猫砂选无香味细颗粒的，粮先沿用原来的，再加一个猫抓板。
category: new-cat
tags: [new-cat, litter-box, scratching]
recommendation: 新猫到家前准备：简单无盖的猫砂盆和无香味的细颗粒猫砂、原来吃的猫粮、分开的食盆和水碗（远离猫砂盆）、一个猫抓板或猫抓柱、航空箱。其他东西等了解了猫的喜好再买。
why_it_matters: >-
  康奈尔大学猫健康中心的新猫指南列出的基本用品只有：猫砂盆、食物、理想情况下再加一个猫抓柱。
  大多数猫喜欢简单无盖的猫砂盆，多数（但不是全部）喜欢无香味的细颗粒猫砂；幼猫和有关节炎的老猫需要低边的盆。食盆和水碗要远离猫砂盆。先继续喂原来的食物，再逐步过渡。
  这样可以避免买了一堆猫不喜欢的东西。
applies_to: [all, kitten]
