id: CG-0015
slug: how-to-choose-a-litter-box
type: buying_guide
title: 买猫砂盆和猫砂看什么
summary: 盆要大（约猫身长的 1.5 倍）、好进出、好清洗；猫砂选细颗粒、无香味、结团的。贵的“除臭”“智能”功能不是重点。
category: buying-guide
tags: [litter-box]
recommendation: >-
  猫砂盆选长方形、长度约为猫从鼻尖到尾根长度的 1.5 倍，入口高度适合你的猫，容易清洗；能用无盖的就用无盖的。
  猫砂选细沙状、无香味、可结团的，铺至少 3 厘米深。不要用盆垫、格栅和除臭粉。
why_it_matters: >-
  2014 年 AAFP/ISFM 乱尿行为指南指出，猫砂盆的大小和数量一样重要，一般来说越大越好，很多市售猫砂盆都太小；指南建议长度约为猫身长的 1.5 倍。
  储物箱、水泥搅拌盘等大号容器都可以当猫砂盆。
  有盖还是无盖：研究显示猫对两者的偏好大致各半，盆的干净程度可能比有没有盖更重要；指南建议尽量用无盖的，方便观察和经常清理，小号有盖盆可能让大体型猫无法正常蹲姿。
  猫砂是卖给人的，不是卖给猫的：“有香味”“除臭”这类卖点是讲给人听的，猫常常反感带香味的猫砂和除臭剂，而且没有任何产品能免去定期清理。
how_to_do_it:
  - 尺寸：量一下猫从鼻尖到尾根的长度，乘以 1.5。买不到就用大号储物箱代替。
  - 入口：幼猫、老年猫、关节不好的猫选低入口。
  - 款式：优先无盖；不确定猫的偏好时，有盖、无盖各放一个，看它用哪个。
  - 猫砂：细颗粒、无香味、结团，至少 3 厘米深。不确定时并排放几种猫砂，让猫自己选。
  - 自动猫砂盆：不是必需品；用之前保留普通猫砂盆，确认猫愿意用。
exceptions:
  - 猫突然拒绝用猫砂盆时，先排除疾病和压力，而不是先换盆。
