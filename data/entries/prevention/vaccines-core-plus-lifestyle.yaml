id: CG-0017
slug: vaccines-core-plus-lifestyle
type: recommendation
title: 疫苗：核心疫苗都打，其他按生活方式定
summary: 疫苗分“所有猫都建议打”的核心疫苗和“按风险决定”的非核心疫苗。不是越多越好，也不是室内猫就不用打。
category: prevention
tags: [vaccine]
recommendation: 和兽医一起，根据猫的年龄、生活方式（是否外出、是否多猫、是否寄养）、来源和当地疾病情况制定疫苗方案：核心疫苗按计划接种，非核心疫苗按风险评估决定。
why_it_matters: >-
  2020 年 AAHA/AAFP 猫疫苗指南把疫苗分为核心疫苗（建议所有猫接种）和非核心疫苗（根据个体风险评估决定）。
  宠物猫的核心疫苗是：猫泛白细胞减少症病毒（猫瘟，FPV）、猫疱疹病毒 1 型（FHV-1）、猫杯状病毒（FCV）、狂犬病，以及 1 岁以下猫的猫白血病病毒（FeLV）。
  1 岁以上低风险的成年猫，猫白血病疫苗属于非核心疫苗。
  指南的大致时间框架是：猫瘟、疱疹、杯状病毒的联苗从不早于 6 周龄开始，每 3 到 4 周一针，直到 16 到 20 周龄；
  考虑在 6 月龄（而不是 1 岁）加强一次，以缩小幼猫母源抗体干扰造成的保护空档；之后每 3 年一次。狂犬病疫苗按疫苗说明书和当地法律执行。
  指南还指出，注射部位肉瘤仍然罕见，每次接种都应同时做全面体检。
how_to_do_it:
  - 第一次带猫看兽医时，说清楚猫是否外出、家里有几只猫、会不会寄养。
  - 保存好疫苗记录（照片或电子记录），寄养、搬家、出境时都会用到。
  - 生活方式改变时（比如开始外出、家里来了新猫），告诉兽医重新评估。
  - 要寄养时，问兽医是否需要提前加强。
exceptions:
  - 怀孕的母猫和不满 4 周龄的幼猫应避免接种。
  - 患有逆转录病毒感染（如猫白血病、猫艾滋）的猫，兽医可能会避开某些活疫苗。
applies_to: [all, kitten, adult, indoor, outdoor]
urgency: important
region_notes: 指南来自北美。哪些疫苗属于核心、加强间隔、狂犬病疫苗的法律要求，因国家和地区而异，也取决于当地能买到哪些疫苗。具体方案以当地兽医和法规为准。
