id: CG-0083
slug: ask-about-anesthesia-safety
type: recommendation
title: 担心麻醉？问兽医怎么评估和监护，而不是拒绝必要的手术
summary: 随着更安全的麻醉药和监护设备普及，麻醉总体上是非常安全的。真正该做的是了解术前检查和术中谁负责监护。
category: vet-visits
tags: [anesthesia]
recommendation: 需要麻醉（洁牙、绝育、手术）时，向兽医了解术前检查、术中由谁监护麻醉、术后如何止痛；不要因为害怕麻醉而选择免麻洁牙或拖延必要的治疗。
why_it_matters: >-
  康奈尔大学猫健康中心的麻醉学专家指出，几乎所有猫的手术都需要麻醉；所有持证兽医都受过麻醉训练；随着更新、更安全的麻醉药和更好的监护工具出现，麻醉总体上是非常安全的程序，主人“没什么需要太担心的”。
  大医院通常有专门的麻醉人员监护，小诊所通常由兽医助理兼任监护。术后止痛只能用兽医开的药。
how_to_do_it:
  - 问：术前要做哪些检查（血液检查等）？
  - 问：麻醉期间谁专门盯着监护？
  - 问：术后疼痛怎么控制？
