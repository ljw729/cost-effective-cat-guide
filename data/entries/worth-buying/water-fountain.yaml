  time_cost: 2
  effort: 2
  harm_potential: 0
  rationale: 收益不确定，需要买设备并持续清洁；便宜的替代方案更多。
evidence:
  level: C
  summary: >-
    唯一找到的直接研究是 13 只猫的小样本、短期研究，结果是饮水机没有明显改变尿浓度。
    证据有限，结论是“目前没有证据表明饮水机明显优于水碗”，而不是“饮水机没用”。
  gaps:
    - 缺少更大样本、更长时间、针对泌尿疾病猫的研究。
