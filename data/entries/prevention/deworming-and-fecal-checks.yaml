id: CG-0053
slug: deworming-and-fecal-checks
type: recommendation
title: 体内驱虫：新猫和幼猫先查粪便，按兽医方案驱虫
summary: 胃肠寄生虫在一些猫群中感染率高达 45%，幼猫更常见，有的还能传给人。每天铲屎、不吃生肉、控制跳蚤能大大减少再感染。
category: prevention
tags: [parasites]
recommendation: 新到家的猫和幼猫请兽医检查粪便并按方案驱虫；之后按兽医建议定期复查。每天清理粪便，不喂生肉，控制跳蚤和老鼠。
why_it_matters: >-
  康奈尔大学猫健康中心指出，胃肠寄生虫在一些猫群中的感染率高达 45%；蛔虫感染 25%–75% 的猫，幼猫比例更高，可经母乳传给小猫，未治疗时可能导致贫血；钩虫可引起黑色柏油样便和失血；有些寄生虫（如猫弓首蛔虫、钩虫）可以感染人，严重时伤害儿童的眼睛和器官。
  再感染很常见，但可以预防：每天清除粪便、定期消毒猫砂盆、避免拥挤、避免生肉饮食、控制跳蚤和啮齿动物。
how_to_do_it:
  - 新猫到家后尽快带一份新鲜粪便去兽医检查。
  - 每天铲屎；处理粪便后洗手，小孩玩沙后洗手。
  - 驱虫药由兽医开具，按说明使用，不要自行加量。
warning_signs:
  - 腹泻、粪便带黏液或血、呕吐
  - 肚子鼓胀（尤其幼猫）、毛发暗淡
  - 粪便或肛门周围看到米粒样白色节片（绦虫）
applies_to: [all, kitten]
urgency: important
