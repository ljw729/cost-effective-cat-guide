id: CG-0067
slug: senior-cognitive-changes
type: recommendation
title: 老年猫半夜乱叫、迷路、发呆：先排除疾病，再考虑认知障碍
summary: 10 岁以上的猫可能出现类似老年痴呆的认知功能障碍，但甲亢、肾病、高血压、关节痛也会造成类似表现。
category: senior
tags: [senior, behavior-change]
recommendation: 老年猫出现夜间嚎叫、迷失方向、长时间发呆、不认人或在盆外排泄时，带去检查，先排除甲亢、肾病、高血压和疼痛。确诊后保持环境稳定、猫砂盆容易到达，避免引入新的动物。
why_it_matters: >-
  康奈尔大学猫健康中心指出，认知功能障碍的行为表现多在 10 岁以上的猫中变得明显，包括空间迷失、失去玩耍兴趣、睡眠增多、作息颠倒、长时间盯着墙发呆、对食物和水漠不关心、在猫砂盆外排泄等。
  但其中一些表现可能来自老年常见病，例如关节炎疼痛、肾衰导致尿多，需要先排除。行为学家建议保持猫砂盆容易到达、避免引入会让老年猫紧张的新动物。
how_to_do_it:
  - 录下夜间嚎叫或迷路的视频给兽医看。
  - 家具和猫用品位置尽量不变。
  - 夜里留一盏小灯。
applies_to: [senior]
