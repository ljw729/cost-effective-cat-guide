name: 新增建议
description: 提议一条新的建议或知识条目
labels: [content, new-entry]
body:
  - type: textarea
    id: question
    attributes:
      label: 要回答的问题
      description: 养猫人实际会问的问题，例如“自动猫砂盆值得买吗？”
    validations: { required: true }
  - type: textarea
    id: recommendation
    attributes:
      label: 建议内容（一句话结论）
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: 来源
      description: 论文 DOI、指南、兽医学院或机构页面链接。社交平台、电商页、营销文章不能作为证据。
    validations: { required: true }
  - type: input
    id: evidence
    attributes:
      label: 你认为的证据等级（A/B/C/D）及理由
  - type: textarea
    id: cost-benefit
    attributes:
      label: 收益与成本
      description: 能带来什么好处？要花多少钱、时间、精力？适用于哪些猫？
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜索过现有条目，没有重复
          required: true
        - label: 我与相关品牌或厂商没有利益关系（如有，请在上面说明）
          required: true
