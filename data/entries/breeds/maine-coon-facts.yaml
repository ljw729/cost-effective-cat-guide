id: CG-0122
slug: maine-coon-facts
type: recommendation
title: 缅因猫：心肌肥厚基因、多囊肾和丙酮酸激酶缺乏
summary: 缅因猫中有一个与肥厚型心肌病相关的基因变异（A31P），带两份时很可能发病。基因检测研究还在缅因猫中发现了多囊肾和丙酮酸激酶缺乏的变异。英国数据中缅因猫平均寿命约 9.7 年。
category: breeds
tags: [maine-coon, heart-disease, genetics]
recommendation: 购买缅因猫时，要求查看父母猫的 MYBPC3（A31P）、PKD1 和丙酮酸激酶缺乏基因检测结果；缅因猫成年后和兽医讨论心脏检查（心脏超声）。基因检测阴性不代表不会得心肌病。
why_it_matters: >-
  一项 11,036 只猫的基因检测研究（已读全文）总结：MYBPC3 A31P 变异与缅因猫肥厚型心肌病相关；只带一份时早年发生临床心肌病的可能性很低，但已观察到心脏功能的局部异常；带两份时很可能发生，且风险随年龄增加。该研究还在缅因猫中发现了多囊肾变异（并确认一个 3 月龄病例），以及带两份丙酮酸激酶缺乏变异的缅因猫，其中一只 1 岁多的公猫严重发病。
  康奈尔大学猫健康中心把缅因猫列为肥厚型心肌病更常见的品种之一；心肌病可能导致充血性心衰、血栓（后腿突然瘫痪）和猝死。英国寿命表研究中，缅因猫出生时预期寿命为 9.71 年。
warning_signs:
  - 呼吸急促或张嘴呼吸：立即就医
  - 后腿突然无力或瘫痪、剧痛：立即急诊
  - 精神差、牙龈苍白或发黄（贫血或溶血）
