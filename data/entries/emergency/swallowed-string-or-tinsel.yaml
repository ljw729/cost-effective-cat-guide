id: CG-0031
slug: swallowed-string-or-tinsel
type: emergency
title: 猫吞了线、绳子、丝带或彩带：马上就医
summary: 线状异物可能缠在舌根或卡在肠道里，像钢丝一样割穿肠壁，危及生命。看到线头也不要硬拉。
category: emergency
tags: [foreign-body]
recommendation: 发现或怀疑猫吞了线、毛线、丝带、彩带（圣诞装饰金属丝）等，立即联系兽医；平时把这类东西收好。
why_it_matters: >-
  康奈尔大学猫健康中心的行为医学医生指出，彩带等线状物可能卡在肠道里，有的能排出，有的需要手术；如果线绕在舌根再被吞下，会在消化过程中像钢丝一样切穿肠壁，“非常危及生命”。
  康奈尔的呕吐页面也把吞下线或毛线列为猫呕吐的常见原因之一。
emergency_action:
  - 立即联系兽医，说明吞了什么、大概多长、多久以前。
  - 如果看到线从嘴里或肛门露出来，保持原样，尽快就医。
do_not:
  - 不要用力拉露在外面的线头。
  - 不要自己催吐。
warning_signs:
  - 看到猫在嚼线、丝带、彩带，之后东西不见了
  - 反复呕吐、不吃东西
  - 舌头下面或嘴里看到缠绕的线
  - 精神差、腹部疼痛（不让摸肚子）
how_to_do_it:
  - 针线、毛线、橡皮筋、丝带、礼品绳用完马上收进抽屉。
  - 逗猫棒等带绳子的玩具玩完收起来，不要让猫单独玩。
  - 节日装饰尽量不用金属彩带。
applies_to: [all]
urgency: emergency
related: [CG-0047]
