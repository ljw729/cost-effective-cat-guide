id: CG-0068
slug: kidney-diet-after-ckd-diagnosis
type: recommendation
title: 确诊慢性肾病后，处方肾病粮是值得的钱
summary: 饮食调整是慢性肾病治疗中有证据支持的一环。有研究显示吃肾病处方粮的猫存活时间是普通猫粮的 2 到 3 倍。换粮要慢，不能让猫饿着。
category: senior
tags: [kidney-disease, senior]
recommendation: 猫确诊慢性肾病后，在兽医指导下逐步换成肾病处方粮（可选湿粮），保证饮水，定期复查血压和血尿；换粮期间确保猫在吃东西。
why_it_matters: >-
  康奈尔大学猫健康中心指出：饮食调整是慢性肾病治疗中重要且已被证实的部分，限制蛋白质、磷和钠的处方粮可能延长寿命、改善生活质量；有研究显示吃肾病处方粮的猫存活时间是吃普通猫粮的 2 到 3 倍。
  患肾病的猫即使短时间不吃东西也可能出现严重问题，所以换粮要逐步进行，注意温度、质地和口味。约 60% 的肾病猫会出现高血压，需要测量和控制。
  早期诊断和治疗与更好的结果有关：IRIS 2 期确诊的猫平均存活 2 到 3 年，4 期平均不到 6 个月。
how_to_do_it:
  - 和兽医一起选择猫愿意吃的处方粮，湿粮干粮都有。
  - 新旧粮混合，逐步过渡。
  - 家里多处放干净的水，可以考虑饮水机。
  - 按兽医安排复查血液、尿液和血压。
do_not:
  - 不要为了换粮让猫饿着。
  - 不要自行购买“护肾”保健品代替处方粮。
